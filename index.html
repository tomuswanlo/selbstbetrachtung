weight: 800;\n  font-display: swap;\n  src: url(\"70a99ae4-01f4-49f2-82cb-89f22d8fa24e\") format(\u0027woff2\u0027);\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\u003c\u002Fstyle\u003e\n\u003cstyle\u003e\u002F* ============================================================\n   SELBSTBETRACHTUNG — Psychologische Beratung online\n   Mobile-first stylesheet\n   Palette: Creme · Petrol · Anthrazit · Sand (Sonnenaufgang)\n   Type: Avenir (Fallback: Mulish)\n============================================================ *\u002F\n\n:root {\n  \u002F* Creme family *\u002F\n  --creme:      #F4EFE7;\n  --creme-2:    #FBF8F2;\n  --creme-3:    #EDE5D8;\n  --creme-card: #FFFFFF;\n\n  \u002F* Petrol *\u002F\n  --petrol:      #2E3439;\n  --petrol-deep: #23282C;\n  --petrol-700:  #181B1E;\n\n  \u002F* Anthrazit \u002F text *\u002F\n  --ink:      #2E3439;\n  --ink-soft: #545C62;\n  --ink-mute: #7C868C;\n\n  \u002F* Accents *\u002F\n  --sand:   #D6A26A;\n  --sand-2: #E6C396;\n  --slate:  #7E909A;\n\n  --line:      rgba(46,52,57,0.12);\n  --line-soft: rgba(46,52,57,0.07);\n\n  --font: \"Avenir Next\", \"Avenir\", \"Mulish\", -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif;\n\n  --nav-h: 64px;\n  --maxw: 1120px;\n  --pad: clamp(20px, 5.5vw, 64px);\n  --radius: 18px;\n  --radius-lg: 26px;\n  --shadow-soft: 0 18px 50px -28px rgba(46,52,57,0.45);\n  --shadow-card: 0 10px 34px -18px rgba(46,52,57,0.30);\n}\n\n* { box-sizing: border-box; }\n\nhtml { scroll-behavior: smooth; }\n\nbody {\n  margin: 0;\n  font-family: var(--font);\n  font-weight: 400;\n  color: var(--ink);\n  background: var(--creme);\n  line-height: 1.65;\n  font-size: 17px;\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n  overflow-x: hidden;\n}\n\nimg { display: block; max-width: 100%; }\n\na { color: inherit; text-decoration: none; }\n\nh1, h2, h3 { font-weight: 600; line-height: 1.18; margin: 0; color: var(--ink); }\n\np { margin: 0 0 1em; text-wrap: pretty; }\n\n::selection { background: var(--sand-2); color: var(--ink); }\n\n\u002F* ---------- Layout helpers ---------- *\u002F\n.wrap { width: 100%; max-width: var(--maxw); margin: 0 auto; padding-inline: var(--pad); }\n\n.section { padding-block: clamp(64px, 11vw, 132px); position: relative; scroll-margin-top: var(--nav-h); }\n.section--creme2 { background: var(--creme-2); }\n.section--band  { background: var(--creme-3); }\n\n.eyebrow {\n  display: inline-flex; align-items: center; gap: 12px;\n  font-size: 12.5px; font-weight: 700; letter-spacing: 0.28em;\n  text-transform: uppercase; color: var(--petrol);\n  margin: 0 0 22px;\n}\n.eyebrow::before {\n  content: \"\"; width: 26px; height: 1.5px; background: var(--sand);\n  display: inline-block;\n}\n.section--dark .eyebrow { color: var(--sand-2); }\n.section--dark .eyebrow::before { background: var(--sand-2); }\n\n.h-section {\n  font-size: clamp(28px, 5.6vw, 44px);\n  letter-spacing: -0.01em;\n  margin-bottom: 18px;\n  max-width: 18ch;\n}\n.lead {\n  font-size: clamp(17px, 2.4vw, 20px);\n  color: var(--ink-soft);\n  max-width: 58ch;\n  font-weight: 400;\n}\n\n\u002F* ============================================================\n   NAVIGATION\n============================================================ *\u002F\n.nav {\n  position: fixed; inset: 0 0 auto 0; z-index: 100;\n  height: var(--nav-h);\n  display: flex; align-items: center;\n  transition: background .3s ease, box-shadow .3s ease, backdrop-filter .3s ease;\n}\n.nav.scrolled {\n  background: rgba(244,239,231,0.86);\n  backdrop-filter: blur(14px) saturate(1.1);\n  -webkit-backdrop-filter: blur(14px) saturate(1.1);\n  box-shadow: 0 1px 0 var(--line-soft);\n}\n.nav__inner { width: 100%; max-width: var(--maxw); margin: 0 auto; padding-inline: var(--pad);\n  display: flex; align-items: center; justify-content: space-between; gap: 16px; }\n.brand { display: flex; align-items: center; gap: 12px; }\n.brand__mark { width: 48px; height: 48px; border-radius: 50%; object-fit: cover;\n  box-shadow: 0 0 0 1px rgba(46,52,57,0.10); }\n.brand__name {\n  font-size: 14px; font-weight: 700; letter-spacing: 0.26em;\n  text-transform: uppercase; color: var(--petrol); white-space: nowrap;\n}\n.nav__links { display: none; }\n.nav .nav__ctaGroup { display: none; }\n.nav__ctaGroup { flex-direction: column; gap: 5px; }\n.nav__ctaBtn { display: inline-flex; align-items: center; justify-content: center; font-family: var(--font); font-size: 12px; font-weight: 600; letter-spacing: 0.01em; padding: 5px 16px; border-radius: 999px; border: 1.5px solid transparent; white-space: nowrap; transition: background .2s ease, color .2s ease, border-color .2s ease; }\n.nav__ctaBtn--primary { background: var(--petrol); color: #fff; }\n.nav__ctaBtn--primary:hover { background: var(--petrol-deep); }\n.nav__ctaBtn--ghost { background: transparent; color: var(--petrol); border-color: rgba(46,52,57,0.35); }\n.nav__ctaBtn--ghost:hover { border-color: var(--petrol); background: rgba(46,52,57,0.06); }\n\n.burger {\n  appearance: none; border: 0; background: transparent; cursor: pointer;\n  width: 44px; height: 44px; display: grid; place-items: center; gap: 0;\n  border-radius: 12px; color: var(--ink);\n}\n.burger span { display: block; width: 22px; height: 2px; background: currentColor; border-radius: 2px;\n  transition: transform .3s ease, opacity .3s ease; }\n.burger span + span { margin-top: 5px; }\n.burger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }\n.burger.open span:nth-child(2) { opacity: 0; }\n.burger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }\n\n\u002F* Mobile menu overlay *\u002F\n.mobile-menu {\n  position: fixed; inset: 0; z-index: 90;\n  background: rgba(244,239,231,0.97);\n  backdrop-filter: blur(8px);\n  -webkit-backdrop-filter: blur(8px);\n  display: flex; flex-direction: column; justify-content: center;\n  padding: var(--nav-h) var(--pad) var(--pad);\n  opacity: 0; pointer-events: none; transition: opacity .3s ease;\n}\n.mobile-menu.open { opacity: 1; pointer-events: auto; }\n.mobile-menu a {\n  font-size: clamp(24px, 7vw, 34px); font-weight: 500; color: var(--ink);\n  padding: 14px 0; border-bottom: 1px solid var(--line-soft);\n  letter-spacing: -0.01em;\n  display: flex; align-items: baseline; gap: 16px;\n}\n.mobile-menu a .num { font-size: 13px; font-weight: 700; color: var(--sand); letter-spacing: 0.1em; }\n.mobile-menu a:last-of-type { border-bottom: 0; }\n\n\u002F* ============================================================\n   HERO\n============================================================ *\u002F\n.hero {\n  position: relative; min-height: 100svh; display: flex;\n  align-items: center; justify-content: center; text-align: center;\n  padding: calc(var(--nav-h) + 40px) var(--pad) 80px;\n  overflow: hidden;\n}\n.hero__bg {\n  position: absolute; inset: 0; z-index: 0;\n  background-image: url(\"\u002Fassets\u002Fabschluss-hintergrund.png\");\n  background-size: cover; background-position: center 60%;\n}\n.hero__veil {\n  position: absolute; inset: 0; z-index: 1;\n  background:\n    radial-gradient(115% 78% at 50% 44%, rgba(244,239,231,0.46) 0%, rgba(244,239,231,0.12) 48%, rgba(244,239,231,0) 74%),\n    linear-gradient(to bottom, rgba(244,239,231,0.34) 0%, rgba(244,239,231,0) 24% 64%, var(--creme) 100%);\n}\n.hero__content { position: relative; z-index: 2; max-width: 760px; }\n.hero__eyebrow {\n  font-size: 12.5px; font-weight: 700; letter-spacing: 0.34em; text-transform: uppercase;\n  color: var(--petrol); margin-bottom: 26px;\n}\n.hero__title {\n  font-size: clamp(23px, 6.3vw, 72px);\n  font-weight: 600; letter-spacing: 0.05em;\n  color: var(--ink); margin: 0; white-space: nowrap;\n  text-indent: 0.05em;\n}\n@media (min-width: 520px) { .hero__title { letter-spacing: 0.1em; text-indent: 0.1em; } }\n@media (min-width: 860px) { .hero__title { letter-spacing: 0.14em; text-indent: 0.14em; } }\n.hero__rule { width: 54px; height: 2px; background: var(--sand); margin: 26px auto 24px; }\n.hero__tagline {\n  font-size: clamp(20px, 4.2vw, 30px); font-weight: 300; color: var(--petrol);\n  letter-spacing: 0.005em; margin: 0 0 22px;\n}\n.hero__trust {\n  display: inline-flex; flex-wrap: wrap; justify-content: center; gap: 8px 18px;\n  font-size: 13.5px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;\n  color: var(--ink-soft); margin-bottom: 38px;\n}\n.hero__trust span { display: inline-flex; align-items: center; gap: 18px; }\n.hero__trust span::after { content: \"·\"; color: var(--sand); }\n.hero__trust span:last-child::after { display: none; }\n\n.cta-row { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }\n\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 10px;\n  font-family: var(--font); font-size: 15.5px; font-weight: 600; letter-spacing: 0.01em;\n  padding: 15px 28px; border-radius: 999px; cursor: pointer; border: 1.5px solid transparent;\n  transition: transform .2s ease, background .25s ease, color .25s ease, border-color .25s ease, box-shadow .25s ease;\n  min-height: 52px;\n}\n.btn--primary { background: var(--petrol); color: #fff; box-shadow: var(--shadow-card); }\n.btn--primary:hover { background: var(--petrol-deep); transform: translateY(-2px); }\n.btn--ghost { background: transparent; color: var(--petrol); border-color: rgba(46,52,57,0.35); }\n.btn--ghost:hover { border-color: var(--petrol); background: rgba(46,52,57,0.06); transform: translateY(-2px); }\n.btn--light { background: #fff; color: var(--petrol); }\n.btn--light:hover { transform: translateY(-2px); box-shadow: var(--shadow-card); }\n.btn--outline-light { background: transparent; color: #fff; border-color: rgba(255,255,255,0.5); }\n.btn--outline-light:hover { background: rgba(255,255,255,0.12); border-color:#fff; transform: translateY(-2px); }\n\n.scroll-cue {\n  position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%);\n  z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 8px;\n  font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--ink-mute);\n}\n.scroll-cue .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--sand);\n  animation: bob 1.8s ease-in-out infinite; }\n@keyframes bob { 0%,100% { transform: translateY(0); opacity:.5; } 50% { transform: translateY(7px); opacity:1; } }\n\n\u002F* ============================================================\n   THEMEN \u0026 BERATUNGSFELDER\n============================================================ *\u002F\n.topics {\n  margin-top: 44px; list-style: none; padding: 0;\n  display: grid; grid-template-columns: 1fr; gap: 12px;\n}\n.topic {\n  display: flex; align-items: flex-start; gap: 14px;\n  background: var(--creme-card); border: 1px solid var(--line-soft);\n  border-radius: 14px; padding: 18px 20px;\n  box-shadow: 0 6px 18px -16px rgba(46,52,57,0.5);\n  transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;\n}\n.topic:hover { transform: translateY(-3px); box-shadow: var(--shadow-card); border-color: rgba(46,52,57,0.18); }\n.topic__dot {\n  flex: none; width: 10px; height: 10px; border-radius: 50%;\n  background: var(--sand); margin-top: 7px;\n  box-shadow: 0 0 0 4px rgba(214,162,106,0.16);\n}\n.topic__text { font-weight: 500; font-size: 16px; color: var(--ink); line-height: 1.4; }\n.topics-close { margin-top: 38px; font-size: clamp(17px,2.2vw,19px); color: var(--ink-soft); max-width: 60ch; }\n\n\u002F* ============================================================\n   FÜR WEN GEEIGNET\n============================================================ *\u002F\n.checklist {\n  margin-top: 40px; list-style: none; padding: 0;\n  display: grid; grid-template-columns: 1fr; gap: 4px;\n}\n.checklist li {\n  display: flex; align-items: flex-start; gap: 16px;\n  padding: 16px 4px; border-bottom: 1px solid var(--line-soft);\n  font-size: 17px; color: var(--ink);\n}\n.check {\n  flex: none; width: 30px; height: 30px; border-radius: 50%;\n  background: rgba(46,52,57,0.10); display: grid; place-items: center; margin-top: 1px;\n}\n.check svg { width: 15px; height: 15px; }\n.callout {\n  margin-top: 40px; display: flex; align-items: center; gap: 18px;\n  background: var(--creme-card); border-left: 3px solid var(--sand);\n  border-radius: 12px; padding: 22px 26px; box-shadow: var(--shadow-card);\n  font-size: clamp(17px,2.4vw,21px); font-weight: 500; color: var(--petrol);\n}\n.callout .pin { display: none; }\n\n\u002F* ============================================================\n   ÜBER MICH\n============================================================ *\u002F\n.about { display: grid; grid-template-columns: 1fr; gap: 40px; align-items: start; }\n.about__media { position: relative; }\n.about__photo {\n  width: 100%; border-radius: var(--radius-lg); object-fit: cover;\n  aspect-ratio: 4 \u002F 5; box-shadow: var(--shadow-soft);\n}\n.about__ai-note {\n  margin-top: 8px; font-size: 11.5px; font-style: italic; color: var(--ink-mute);\n}\n.about__badge {\n  margin-top: 18px; display: inline-flex; align-items: center; gap: 12px;\n  background: var(--creme-card); border: 1px solid var(--line-soft); border-radius: 14px;\n  padding: 14px 18px; box-shadow: var(--shadow-card);\n}\n.about__badge .seal { flex: none; width: 40px; height: 40px; border-radius: 50%;\n  background: rgba(46,52,57,0.10); display: grid; place-items: center; color: var(--petrol); }\n.about__badge .seal svg { width: 20px; height: 20px; }\n.about__badge b { font-size: 14.5px; color: var(--ink); display: block; }\n.about__badge small { font-size: 12.5px; color: var(--ink-mute); line-height: 1.4; }\n\n.about__name { font-size: clamp(24px,4.5vw,34px); margin-bottom: 4px; }\n.about__role { font-size: 14px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase;\n  color: var(--petrol); margin-bottom: 24px; }\n.about__text p { font-size: 17px; color: var(--ink-soft); }\n\n.certs { margin-top: 30px; }\n.certs__label { font-size: 12.5px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase;\n  color: var(--ink-mute); margin-bottom: 14px; }\n.certs__grid { display: flex; gap: 16px; flex-wrap: wrap; }\n.cert {\n  position: relative; width: 120px; cursor: pointer; border: 0; background: none; padding: 0;\n  border-radius: 10px; overflow: hidden; box-shadow: var(--shadow-card);\n  transition: transform .25s ease;\n}\n.cert:hover { transform: translateY(-3px); }\n.cert img { width: 100%; height: 158px; object-fit: cover; object-position: top; }\n.cert__cap { display: block; font-size: 11.5px; color: var(--ink-mute); padding: 8px 4px 0; text-align: left; }\n.cert .zoom { position: absolute; top: 8px; right: 8px; width: 26px; height: 26px; border-radius: 50%;\n  background: rgba(46,52,57,0.55); color:#fff; display: grid; place-items: center; font-size: 13px; }\n\n\u002F* ============================================================\n   ABLAUF\n============================================================ *\u002F\n.steps { margin-top: 44px; display: grid; grid-template-columns: 1fr; gap: 0; position: relative; }\n.step {\n  display: grid; grid-template-columns: 56px 1fr; gap: 20px; padding-bottom: 30px; position: relative;\n}\n.step:not(:last-child)::before {\n  content: \"\"; position: absolute; left: 27px; top: 52px; bottom: 4px; width: 2px;\n  background: linear-gradient(var(--sand), rgba(214,162,106,0.2));\n}\n.step__num {\n  width: 54px; height: 54px; border-radius: 50%; flex: none;\n  background: var(--creme-card); border: 2px solid var(--sand);\n  display: grid; place-items: center; font-weight: 700; font-size: 19px; color: var(--petrol);\n  box-shadow: var(--shadow-card); z-index: 1;\n}\n.step__body h3 { font-size: 19px; margin-bottom: 4px; padding-top: 11px; }\n.step__body p { color: var(--ink-soft); margin: 0; }\n\n.facts { margin-top: 22px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }\n.fact {\n  background: var(--creme-card); border: 1px solid var(--line-soft); border-radius: 14px;\n  padding: 20px; box-shadow: var(--shadow-card);\n}\n.fact .k { font-size: 12px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-mute); }\n.fact .v { font-size: clamp(18px,3vw,22px); font-weight: 600; color: var(--petrol); margin-top: 6px; }\n.note-line { margin-top: 24px; font-size: 15px; color: var(--ink-mute); display: flex; gap: 10px; align-items: flex-start; }\n.note-line svg { flex: none; width: 17px; height: 17px; margin-top: 3px; color: var(--petrol); }\n\n\u002F* ============================================================\n   PREISE\n============================================================ *\u002F\n.pricing { display: grid; grid-template-columns: 1fr; gap: 24px; margin-top: 44px; }\n.price-card {\n  background: var(--petrol); color: #fff; border-radius: var(--radius-lg);\n  padding: clamp(28px,5vw,44px); box-shadow: var(--shadow-soft); position: relative; overflow: hidden;\n}\n.price-card::after {\n  content: \"\"; position: absolute; right: -60px; top: -60px; width: 200px; height: 200px;\n  border-radius: 50%; background: radial-gradient(circle, rgba(230,195,150,0.4), transparent 70%);\n}\n.price-card .tier { font-size: 13px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--sand-2); }\n.price-card .amount { font-size: clamp(42px,9vw,64px); font-weight: 700; letter-spacing: -0.02em; margin: 10px 0 2px; line-height: 1; }\n.price-card .amount small { font-size: 0.34em; font-weight: 600; color: rgba(255,255,255,0.7); letter-spacing: 0.04em; }\n.price-card .dur { color: rgba(255,255,255,0.78); font-size: 16px; margin-bottom: 26px; }\n.price-card .btn { width: 100%; }\n\n.services { background: var(--creme-card); border: 1px solid var(--line-soft); border-radius: var(--radius-lg);\n  padding: clamp(26px,5vw,40px); box-s dem, womit Sie sich am wohlsten fühlen. Sie benötigen lediglich ein Smartphone, Tablet oder einen Computer mit Internetverbindung.\" }\n    },\n    {\n      \"@type\": \"Question\",\n      \"name\": \"Was ist, wenn ich nicht weiß, ob mein Anliegen passt?\",\n      \"acceptedAnswer\": { \"@type\": \"Answer\", \"text\": \"Das ist völlig in Ordnung. Es gibt keine zu kleinen oder zu großen Themen. In einem kurzen Vorgespräch klären wir gemeinsam Ihr Anliegen und schauen in Ruhe, ob die Beratung das Richtige für Sie ist – ganz unverbindlich.\" }\n    },\n    {\n      \"@type\": \"Question\",\n      \"name\": \"Ist eine psychologische Beratung dasselbe wie eine Psychotherapie?\",\n      \"acceptedAnswer\": { \"@type\": \"Answer\", \"text\": \"Nein. Die psychologische Beratung dient der persönlichen Klärung, Reflexion und Orientierung. Sie ersetzt keine ärztliche oder psychotherapeutische Behandlung und stellt keine Heilbehandlung im Sinne des Heilpraktikergesetzes dar. Bei einer akuten Erkrankung oder Krise wenden Sie sich bitte an ärztliche oder therapeutische Stellen.\" }\n    },\n    {\n      \"@type\": \"Question\",\n      \"name\": \"Ist eine Online-Beratung genauso wirksam wie ein Gespräch vor Ort?\",\n      \"acceptedAnswer\": { \"@type\": \"Answer\", \"text\": \"Studien zeigen vergleichbare Wirksamkeit zu Präsenzgesprächen. Viele Menschen öffnen sich sogar leichter aus der vertrauten Umgebung zu Hause statt in einer fremden Praxis.\" }\n    },\n    {\n      \"@type\": \"Question\",\n      \"name\": \"Wie läuft die Bezahlung ab?\",\n      \"acceptedAnswer\": { \"@type\": \"Answer\", \"text\": \"Ein Einzelgespräch von 60 Minuten kostet 70 €. Die Kosten werden nicht von den Krankenkassen übernommen. Die Details zur Bezahlung besprechen wir im Vorfeld transparent miteinander.\" }\n    },\n    {\n      \"@type\": \"Question\",\n      \"name\": \"Wie schnell bekomme ich eine Antwort?\",\n      \"acceptedAnswer\": { \"@type\": \"Answer\", \"text\": \"In der Regel antworte ich innerhalb von 24 Stunden auf Ihre Nachricht. Anschließend finden wir gemeinsam einen Termin, der gut in Ihren Alltag passt.\" }\n    },\n    {\n      \"@type\": \"Question\",\n      \"name\": \"Muss ich mit einer Wartezeit rechnen?\",\n      \"acceptedAnswer\": { \"@type\": \"Answer\", \"text\": \"Psychologische Beratung ist nicht an die Vergabe von Kassen-Therapieplätzen gebunden: Es gibt keine Warteliste und keine Genehmigung durch eine Krankenkasse. Auf Ihre Nachricht antworte ich in der Regel innerhalb von 24 Stunden, den konkreten Termin stimmen wir anschließend individuell ab.\" }\n    },\n    {\n      \"@type\": \"Question\",\n      \"name\": \"Wie viele Gespräche brauche ich?\",\n      \"acceptedAnswer\": { \"@type\": \"Answer\", \"text\": \"Es gibt keine feste Mindestanzahl und keine Vertragsbindung. Manche Anliegen klären sich in einem einzigen Gespräch, andere brauchen eine Begleitung über mehrere Termine. Der Beratungsvertrag kann jederzeit und ohne Begründung von beiden Seiten beendet werden.\" }\n    },\n    {\n      \"@type\": \"Question\",\n      \"name\": \"Kann ich anonym bleiben – entsteht ein Eintrag in einer Akte?\",\n      \"acceptedAnswer\": { \"@type\": \"Answer\", \"text\": \"Es wird keine Diagnose gestellt, es entsteht kein Eintrag in einer medizinischen Akte und es erfolgt keine Meldung an Krankenkassen, Arbeitgeber oder andere Institutionen. Über den Gesprächsverlauf führe ich ein internes Protokoll, das ausschließlich der Dokumentation dient, der Schweigepflicht nach § 203 StGB unterliegt und in das Sie jederzeit Einsicht nehmen können. Sie entscheiden in jedem Gespräch selbst, was Sie von sich preisgeben.\" }\n    },\n    {\n      \"@type\": \"Question\",\n      \"name\": \"Werden die Gespräche aufgezeichnet?\",\n      \"acceptedAnswer\": { \"@type\": \"Answer\", \"text\": \"Nein. Eine Aufzeichnung der Beratungsgespräche erfolgt grundsätzlich nicht – weder per Videoanruf noch per Telefon.\" }\n    },\n    {\n      \"@type\": \"Question\",\n      \"name\": \"Wie sicher ist die Kontaktaufnahme per WhatsApp?\",\n      \"acceptedAnswer\": { \"@type\": \"Answer\", \"text\": \"WhatsApp-Nachrichten sind Ende-zu-Ende-verschlüsselt. Ihre Telefonnummer und die Metadaten verarbeitet WhatsApp jedoch eigenverantwortlich – darauf habe ich keinen Einfluss. Wenn Ihnen das wichtig ist, nutzen Sie für die Kontaktaufnahme bitte E-Mail oder Telefon. Das Beratungsgespräch selbst können Sie unabhängig davon per Videoanruf oder Telefon führen.\" }\n    },\n    {\n      \"@type\": \"Question\",\n      \"name\": \"Was gilt, wenn ich einen Termin absagen muss?\",\n      \"acceptedAnswer\": { \"@type\": \"Answer\", \"text\": \"Einen vereinbarten Termin können Sie bis 24 Stunden vorher kostenlos absagen oder verschieben. Bei einer späteren Absage oder bei Nichterscheinen wird eine Ausfallgebühr in Höhe des vollen Honorars fällig.\" }\n    },\n    {\n      \"@type\": \"Question\",\n      \"name\": \"Muss ich nach Mönchengladbach kommen?\",\n      \"acceptedAnswer\": { \"@type\": \"Answer\", \"text\": \"Nein. Die Beratung findet vollständig online statt – per Videoanruf, Telefon oder WhatsApp. Der Sitz von Selbstbetrachtung ist Mönchengladbach, beraten wird deutschlandweit. Eine Praxis für persönliche Termine vor Ort gibt es nicht.\" }\n    },\n    {\n      \"@type\": \"Question\",\n      \"name\": \"Was tue ich in einer akuten Krise?\",\n      \"acceptedAnswer\": { \"@type\": \"Answer\", \"text\": \"Für akute Krisen ist psychologische Beratung nicht das richtige Angebot. Wenn Sie sich in einer akuten Notlage befinden oder Suizidgedanken haben, wenden Sie sich bitte sofort an die Telefonseelsorge unter 0800 111 0 111 oder 0800 111 0 222 (kostenfrei, rund um die Uhr), an den ärztlichen Bereitschaftsdienst unter 116 117 oder im Notfall an den Notruf 112.\" }\n    }\n  ]\n}\n\u003c\u002Fscript\u003e\n\u003c!-- Usability-Feinschliff (2026-08-14) --\u003e\n\u003cnoscript\u003e\u003cstyle\u003e.reveal{opacity:1 !important;tran       \u003cspan\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"\u003e\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"\u003e\u003c\u002Fcircle\u003e\u003cpath d=\"M12 7v5l3 2\"\u003e\u003c\u002Fpath\u003e\u003c\u002Fsvg\u003eAntwort innerhalb 24 Stunden\u003c\u002Fspan\u003e\n      \u003cspan\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"\u003e\u003crect x=\"4\" y=\"11\" width=\"16\" height=\"10\" rx=\"2\"\u003e\u003c\u002Frect\u003e\u003cpath d=\"M8 11V7a4 4 0 0 1 8 0v4\"\u003e\u003c\u002Fpath\u003e\u003c\u002Fsvg\u003eVertraulich · keine Kassen-Meldung\u003c\u002Fspan\u003e\n      \u003cspan\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"\u003e\u003crect x=\"2\" y=\"6\" width=\"14\" height=\"12\" rx=\"2\"\u003e\u003c\u002Frect\u003e\u003cpath d=\"m16 10 6-3v10l-6-3\"\u003e\u003c\u002Fpath\u003e\u003c\u002Fsvg\u003eOnline per Video oder Telefon\u003c\u002Fspan\u003e\n    \u003c\u002Fdiv\u003e\n\n    \u003cdiv class=\"cta-row\"\u003e\n      \u003ca class=\"btn btn--primary\" href=\"#kontakt\"\u003eKostenloses Erstgespräch anfragen\u003c\u002Fa\u003e\n      \u003ca class=\"btn btn--ghost\" href=\"#themen\"\u003eMehr erfahren\u003c\u002Fa\u003e\n    \u003c\u002Fdiv\u003e\n\n    \u003cdiv class=\"hero__by\"\u003e\n      \u003cimg class=\"hero__avatar\" src=\"\u002Fabout-photo.php\" alt=\"Gabriele Küppers, Ihre Beraterin\"\u003e\n      \u003cspan\u003eIhre Beraterin · \u003cb\u003eGabriele Küppers\u003c\u002Fb\u003e\u003cbr\u003e\u003csmall style=\"font-size:12px;opacity:.85\"\u003eZertifizierte psychologische Beraterin · Impulse e.V. Wuppertal\u003c\u002Fsmall\u003e\u003c\u002Fspan\u003e\n    \u003c\u002Fdiv\u003e\n  \u003c\u002Fdiv\u003e\n  \u003ca class=\"scroll-cue\" href=\"#themen\" aria-label=\"Nach unten scrollen\"\u003e\n    \u003cspan\u003eEntdecken\u003c\u002Fspan\u003e\u003cspan class=\"dot\"\u003e\u003c\u002Fspan\u003e\n  \u003c\u002Fa\u003e\n\u003c\u002Fsection\u003e\n\n\u003c!-- ===================== THEMEN ===================== --\u003e\n\u003csection class=\"section\" id=\"themen\" aria-labelledby=\"themen-h\"\u003e\n  \u003cdiv class=\"wrap\"\u003e\n    \u003cp class=\"eyebrow reveal\"\u003eThemen \u0026amp; Beratungsfelder\u003c\u002Fp\u003e\n    \u003ch2 class=\"h-section reveal\" id=\"themen-h\" data-d=\"1\"\u003eRaum für Reflexion, Entlastung und persönliche Entwicklung\u003c\u002Fh2\u003e\n    \u003cp class=\"lead reveal\" data-d=\"2\"\u003eDie psychologische Online-Beratung bei Selbstbetrachtung schafft einen geschützten Rahmen, in dem Sie Ihre Gedanken ordnen, belastende Gefühle besser verstehen und neue Perspektiven für Ihren Alltag entwickeln können. Begleitung erhalten Sie unter anderem bei:\u003c\u002Fp\u003e\n\n    \u003cdiv class=\"tgroups\"\u003e\n      \u003cdiv class=\"tgroup reveal\"\u003e\n        \u003ch4\u003eWenn die Seele Last trägt\u003c\u002Fh4\u003e\n        \u003cul\u003e\u003cli\u003eEinsamkeit \u0026amp; sozialer Rückzug\u003c\u002Fli\u003e\u003cli\u003eEmotionale Belastung\u003c\u002Fli\u003e\u003cli\u003eBelastende Lebenssituationen\u003c\u002Fli\u003e\u003c\u002Ful\u003e\n      \u003c\u002Fdiv\u003e\n      \u003cdiv class=\"tgroup reveal\" data-d=\"1\"\u003e\n        \u003ch4\u003eWenn alles zu viel wird\u003c\u002Fh4\u003e\n        \u003cul\u003e\u003cli\u003eInnere Unruhe \u0026amp; Überforderung\u003c\u002Fli\u003e\u003cli\u003eStress \u0026amp; Erschöpfung\u003c\u002Fli\u003e\u003cli\u003eGesellschaftliche Verunsicherung \u0026amp; Zukunftsängste\u003c\u002Fli\u003e\u003c\u002Ful\u003e\n      \u003c\u002Fdiv\u003e\n      \u003cdiv class=\"tgroup reveal\"\u003e\n        \u003ch4\u003eWenn Sie sich selbst besser verstehen möchten\u003c\u002Fh4\u003e\n        \u003cul\u003e\u003cli\u003eSelbstzweifel\u003c\u002Fli\u003e\u003cli\u003eSelbstreflexion\u003c\u002Fli\u003e\u003cli\u003ePersönliche Entwicklung\u003c\u002Fli\u003e\u003c\u002Ful\u003e\n      \u003c\u002Fdiv\u003e\n      \u003cdiv class=\"tgroup reveal\" data-d=\"1\"\u003e\n        \u003ch4\u003eWenn Sie an einem Wendepunkt stehen\u003c\u002Fh4\u003e\n        \u003cul\u003e\u003cli\u003eNeuorientierung\u003c\u002Fli\u003e\u003cli\u003eEntscheidungsfindung\u003c\u002Fli\u003e\u003cli\u003eBeziehungsthemen\u003c\u002Fli\u003e\u003c\u002Ful\u003e\n      \u003c\u002Fdiv\u003e\n    \u003c\u002Fdiv\u003e\n\n    \u003cp class=\"topics-close reveal\"\u003eGemeinsam schauen wir achtsam auf das, was Sie beschäftigt – damit aus belastenden Gedanken wieder Klarheit und Handlungsspielraum entstehen.\u003c\u002Fp\u003e\n\n    \u003cdiv class=\"def reveal\"\u003e\n      \u003ch3\u003eWas ist psychologische Beratung – und was nicht?\u003c\u002Fh3\u003e\n      \u003cp\u003ePsychologische Beratung unterstützt Sie dabei, belastende Situationen zu ordnen, Entscheidungen zu klären und neue Perspektiven zu entwickeln. Sie setzt an konkreten Themen und Ihrer aktuellen Lebenssituation an.\u003c\u002Fp\u003e\n      \u003cp\u003eSie ist \u003cstrong\u003ekeine Psychotherapie\u003c\u002Fstrong\u003e und ersetzt keine ärztliche oder psychotherapeutische Behandlung: Es werden keine psychischen Erkrankungen diagnostiziert oder behandelt. Bei akuten Krisen oder Erkrankungen wenden Sie sich bitte an ärztliche oder therapeutische Stellen.\u003c\u002Fp\u003e\n    \u003c\u002Fdiv\u003e\n  \u003c\u002Fdiv\u003e\n\u003c\u002Fsection\u003e\n\n\u003c!-- ===================== FÜR WEN ===================== --\u003e\n\u003csection class=\"section section--band\" id=\"fuer-wen\" aria-labelledby=\"fuer-wen-h\"\u003e\n  \u003cdiv class=\"wrap\"\u003e\n    \u003cp class=\"eyebrow reveal\"\u003eFür wen geeignet\u003c\u002Fp\u003e\n    \u003ch2 class=\"h-section reveal\" id=\"fuer-wen-h\" data-d=\"1\"\u003eEin Angebot für Menschen, die sich Klarheit wünschen\u003c\u002Fh2\u003e\n    \u003cp class=\"lead reveal\" data-d=\"2\"\u003eDie Beratung richtet sich an Erwachsene, die sich in einer belastenden Phase Begleitung wünschen oder sich selbst und ihre Lebenssituation besser verstehen möchten – ganz gleich, ob es um konkrete Entscheidungen oder um stille innere Themen geht.\u003c\u002Fp\u003e\n\n    \u003cul class=\"checklist\"\u003e\n      \u003cli class=\"reveal\"\u003e\u003cspan class=\"check\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#2E3439\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"\u003e\u003cpath d=\"M5 13l4 4L19 7\"\u003e\u003c\u002Fpath\u003e\u003c\u002Fsvg\u003e\u003c\u002Fspan\u003eSie fühlen sich einsam oder emotional belastet\u003c\u002Fli\u003e\n      \u003cli class=\"reveal\"\u003e\u003cspan class=\"check\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#2E3439\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"\u003e\u003cpath d=\"M5 13l4 4L19 7\"\u003e\u003c\u002Fpath\u003e\u003c\u002Fsvg\u003e\u003c\u002Fspan\u003eSie möchten sich selbst besser verstehen\u003c\u002Fli\u003e\n      \u003cli class=\"reveal\"\u003e\u003cspan class=\"check\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#2E3439\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"\u003e\u003cpath d=\"M5 13l4 4L19 7\"\u003e\u003c\u002Fpath\u003e\u003c\u002Fsvg\u003e\u003c\u002Fspan\u003eSie suchen Orientierung in schwierigen Lebensphasen\u003c\u002Fli\u003e\n      \u003cli class=\"reveal\"\u003e\u003cspan class=\"check\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#2E3439\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"\u003e\u003cpath d=\"M5 13l4 4L19 7\"\u003e\u003c\u002Fpath\u003e\u003c\u002Fsvg\u003e\u003c\u002Fspan\u003eSie wünschen sich einen geschützten Gesprächsraum\u003c\u002Fli\u003e\n      \u003cli class=\"reveal\"\u003e\u003cspan class=\"check\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#2E3439\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"\u003e\u003cpath d=\"M5 13l4 4L19 7\"\u003e\u003c\u002Fpath\u003e\u003c\u002Fsvg\u003e\u003c\u002Fspan\u003eSie möchten persönliche Themen in Ruhe reflektieren\u003c\u002Fli\u003e\n      \u003cli class=\"reveal\"\u003e\u003cspan class=\"check\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#2E3439\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"\u003e\u003cpath d=\"M5 13l4 4L19 7\"\u003e\u003c\u002Fpath\u003e\u003c\u002Fsvg\u003e\u003c\u002Fspan\u003eSie wünschen sich mehr innere Klarheit\u003c\u002Fli\u003e\n      \u003cli class=\"reveal\"\u003e\u003cspan class=\"check\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#2E3439\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"\u003e\u003cpath d=\"M5 13l4 4L19 7\"\u003e\u003c\u002Fpath\u003e\u003c\u002Fsvg\u003e\u003c\u002Fspan\u003eSie möchten neue Perspektiven entwickeln\u003c\u002Fli\u003e\n    \u003c\u002Ful\u003e\n\n    \u003cdiv class=\"callout reveal\"\u003e\n      \u003cspan class=\"pin\" aria-hidden=\"true\"\u003e\u003c\u002Fspan\u003e\n      Die Beratung erfolgt vollständig online und ortsunabhängig – ganz bequem von zu Hause aus.\n    \u003c\u002Fdiv\u003e\n\n    \u003cdiv class=\"def reveal\"\u003e\n      \u003ch3\u003eWann psychologische Beratung nicht das richtige Angebot ist\u003c\u002Fh3\u003e\n      \u003cp\u003ePsychologische Beratung eignet sich \u003cstrong\u003enicht\u003c\u002Fstrong\u003e bei akuten psychischen Krisen, bei Suizidgedanken, bei einer diagnostizierten psychischen Erkrankung, die behandelt werden muss, sowie bei Suchterkrankungen. In diesen Fällen sind ärztliche oder psychotherapeutische Fachpersonen die richtigen Ansprechpartner – die Beratung darf und will diese Behandlung nicht ersetzen.\u003c\u002Fp\u003e\n      \u003cp\u003eSie richtet sich außerdem ausschließlich an Erwachsene und ist kein Angebot für Paar- oder Familientherapie im therapeutischen Sinne.\u003c\u002Fp\u003e\n    \u003c\u002Fdiv\u003e\n  \u003c\u002Fdiv\u003e\n\u003c\u002Fsection\u003e\n\n\u003c!-- ===================== ÜBER MICH ===================== --\u003e\n\u003csection class=\"section\" id=\"ueber-mich\" aria-labelledby=\"ueber-mich-h\"\u003e\n  \u003cdiv class=\"wrap\"\u003e\n    \u003cp class=\"eyebrow reveal\"\u003eÜber mich\u003c\u002Fp\u003e\n    \u003cdiv class=\"about\"\u003e\n      \u003cdiv class=\"about__media reveal\"\u003e\n        \u003cimg class=\"about__photo\" src=\"\u002Fabout-photo.php\" alt=\"Gabriele Küppers, psychologische Beraterin und Personal Coach\"\u003e\n        \u003cp class=\"about__ai-note\"\u003eHinweis: Der Bildhintergrund wurde mit KI erstellt.\u003c\u002Fp\u003e\n        \u003cdiv class=\"about__badge\"\u003e\n          \u003cspan class=\"seal\" aria-hidden=\"true\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"\u003e\u003cpath d=\"M12 2l2.4 5 5.6.6-4 4 1 5.5L12 19l-5 2.6 1-5.5-4-4 5.6-.6z\"\u003e\u003c\u002Fpath\u003e\u003c\u002Fsvg\u003e\u003c\u002Fspan\u003e\n          \u003cdiv\u003e\n            \u003cb\u003ePsychologische Beraterin (Personal Coach)\u003c\u002Fb\u003e\n            \u003csmall\u003eAusbildung an der Schule für Freie Gesundheitsberufe · Impulse e.V., Wuppertal · 2018–2022\u003c\u002Fsmall\u003e\n          \u003c\u002Fdiv\u003e\n        \u003c\u002Fdiv\u003e\n      \u003c\u002Fdiv\u003e\n\n      \u003cdiv class=\"about__body reveal\" data-d=\"1\"\u003e\n        \u003ch2 class=\"about__name\" id=\"ueber-mich-h\"\u003eGabriele Küppers\u003c\u002Fh2\u003e\n        \u003cp class=\"about__role\"\u003ePsychologische Beraterin \u0026amp; Coach\u003c\u002Fp\u003e\n        \u003cp class=\"about__loc\" style=\"font-size:13.5px;color:var(--ink-mute);margin:2px 0 0;letter-spacing:.02em\"\u003eMönchengladbach · deutschlandweit online\u003c\u002Fp\u003e\n        \u003cdiv class=\"about__text\"\u003e\n          \u003cp\u003eGabriele Küppers ist zertifizierte psychologische Beraterin und Personal Coach in Mönchengladbach und begleitet Erwachsene deutschlandweit online. Die Ausbildung absolvierte sie von 2018 bis 2022 an der Schule für Freie Gesundheitsberufe, Impulse e.V. in Wuppertal, und schloss sie mit Zertifikat und Abschlusszeugnis ab.\u003c\u002Fp\u003e\n          \u003cp\u003eMit Empathie, Wertschätzung und einem offenen Blick für Ihre ganz individuelle Lebenssituation begleite ich Sie dabei, Ordnung in das zu bringen, was Sie beschäftigt.\u003c\u002Fp\u003e\n          \u003cp\u003eÜber viele Jahre verantwortungsvoller Berufstätigkeit habe ich Erfahrung im Umgang mit unterschiedlichsten Menschen, belastenden Situationen und einer klaren, respektvollen Kommunikation gesammelt.\u003c\u002Fp\u003e\n          \u003cp\u003eIm Mittelpunkt meiner Arbeit stehen achtsame Gespräche, innere Klärung und persönliche Entwicklung – in einem Rahmen, der von Vertrauen und Respekt getragen ist.\u003c\u002Fp\u003e\n        \u003c\u002Fdiv\u003e\n\n        \u003cdiv class=\"certs\"\u003e\n          \u003cp class=\"certs__label\"\u003eQualifikation \u0026amp; Nachweise\u003c\u002Fp\u003e\n          \u003cdiv class=\"certs__grid\"\u003e\n            \u003cbutton class=\"cert\" data-src=\"\u002Fassets\u002Fzertifikat-psychologische-beraterin.png\" aria-label=\"Zertifikat ansehen\"\u003e\n              \u003cspan class=\"zoom\" aria-hidden=\"true\"\u003e⤢\u003c\u002Fspan\u003e\n              \u003cimg src=\"\u002Fassets\u002Fzertifikat-psychologische-beraterin.png\" alt=\"Zertifikat Psychologische Beraterin (Personal Coach), Impulse e.V.\"\u003e\n              \u003cspan class=\"cert__cap\"\u003eZertifikat\u003c\u002Fspan\u003e\n            \u003c\u002Fbutton\u003e\n            \u003cbutton class=\"cert\" data-src=\"\u002Fassets\u002Fvfp-mitgliedssiegel.png\" aria-label=\"VFP-Mitgliedssiegel ansehen\"\u003e\n              \u003cspan class=\"zoom\" aria-hidden=\"true\"\u003e⤢\u003c\u002Fspan\u003e\n              \u003cimg src=\"\u002Fassets\u002Fvfp-mitgliedssiegel.png\" alt=\"Mitgliedssiegel Verband Freier Psychotherapeuten, Heilpraktiker fuer Psychotherapie und Psychologischer Berater e.V. (VFP)\"\u003e\n              \u003cspan class=\"cert__cap\"\u003eVFP-Mitgliedschaft\u003c\u002Fspan\u003e\n            \u003c\u002Fbutton\u003e\n          \u003c\u002Fdiv\u003e\n        \u003c\u002Fdiv\u003e\n      \u003c\u002Fdiv\u003e\n    \u003c\u002Fdiv\u003e\n  \u003c\u002Fdiv\u003e\n\u003c\u002Fsection\u003e\n\n\u003c!-- ===================== ABLAUF ===================== --\u003e\n\u003csection class=\"section section--band\" id=\"ablauf\" aria-labelledby=\"ablauf-h\"\u003e\n  \u003cdiv class=\"wrap\"\u003e\n    \u003cp class=\"eyebrow reveal\"\u003eAblauf der Online-Beratung\u003c\u002Fp\u003e\n    \u003ch2 class=\"h-section reveal\" id=\"ablauf-h\" data-d=\"1\"\u003eIn vier ruhigen Schritten zum Gespräch\u003c\u002Fh2\u003e\n    \u003cp class=\"lead reveal\" data-d=\"2\"\u003eDer Weg zur Beratung ist unkompliziert und transparent. Sie bestimmen das Tempo – ich begleite Sie von der ersten Nachricht bis zum gemeinsamen Gespräch.\u003c\u002Fp\u003e\n\n    \u003cdiv class=\"steps\"\u003e\n      \u003cdiv class=\"step reveal\"\u003e\n        \u003cdiv class=\"step__num\"\u003e1\u003c\u002Fdiv\u003e\n        \u003cdiv class=\"step__body\"\u003e\u003ch3\u003eKontaktaufnahme\u003c\u002Fh3\u003e\u003cp\u003eSie melden sich ganz unverbindlich per E-Mail oder WhatsApp.\u003c\u002Fp\u003e\u003c\u002Fdiv\u003e\n      \u003c\u002Fdiv\u003e\n      \u003cdiv class=\"step reveal\"\u003e\n        \u003cdiv class=\"step__num\"\u003e2\u003c\u002Fdiv\u003e\n        \u003cdiv class=\"step__body\"\u003e\u003ch3\u003eKurzes Vorgespräch\u003c\u002Fh3\u003e\u003cp\u003eWir klären zunächst Ihr Anliegen und schauen, ob die Beratung zu Ihnen passt.\u003c\u002Fp\u003e\u003c\u002Fdiv\u003e\n      \u003c\u002Fdiv\u003e\n      \u003cdiv class=\"step reveal\"\u003e\n        \u003cdiv class=\"step__num\"\u003e3\u003c\u002Fdiv\u003e\n        \u003cdiv class=\"step__body\"\u003e\u003ch3\u003eTerminvereinbarung\u003c\u002Fh3\u003e\u003cp\u003eGemeinsam finden wir einen Termin, der gut in Ihren Alltag passt.\u003c\u002Fp\u003e\u003c\u002Fdiv\u003e\n      \u003c\u002Fdiv\u003e\n      \u003cdiv class=\"step reveal\"\u003e\n        \u003cdiv class=\"step__num\"\u003e4\u003c\u002Fdiv\u003e\n        \u003cdiv class=\"step__body\"\u003e\u003ch3\u003eOnline-Beratung\u003c\u002Fh3\u003e\u003cp\u003eDas Gespräch findet per Video, Telefon oder WhatsApp statt – ganz wie Sie möchten.\u003c\u002Fp\u003e\u003c\u002Fdiv\u003e\n      \u003c\u002Fdiv\u003e\n    \u003c\u002Fdiv\u003e\n\n    \u003cdiv class=\"facts reveal\"\u003e\n      \u003cdiv class=\"fact\"\u003e\u003cdiv class=\"k\"\u003eDauer\u003c\u002Fdiv\u003e\u003cdiv class=\"v\"\u003e60 Minuten\u003c\u002Fdiv\u003e\u003c\u002Fdiv\u003e\n      \u003cdiv class=\"fact\"\u003e\u003cdiv class=\"k\"\u003eOrt\u003c\u002Fdiv\u003e\u003cdiv class=\"v\"\u003eOnline \u0026amp; flexibel\u003c\u002Fdiv\u003e\u003c\u002Fdiv\u003e\n    \u003c\u002Fdiv\u003e\n    \u003cp class=\"note-line reveal\"\u003e\n      \u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"\u003e\u003crect x=\"3\" y=\"11\" width=\"18\" height=\"11\" rx=\"2\"\u003e\u003c\u002Frect\u003e\u003cpath d=\"M7 11V7a5 5 0 0 1 10 0v4\"\u003e\u003c\u002Fpath\u003e\u003c\u002Fsvg\u003e\n      Alle Gespräche finden in einem geschützten und vertraulichen Rahmen statt.\n    \u003c\u002Fp\u003e\n  \u003c\u002Fdiv\u003e\n\u003c\u002Fsection\u003e\n\n\u003c!-- ===================== PREISE ===================== --\u003e\n\u003csection class=\"section\" id=\"preise\" aria-labelledby=\"preise-h\"\u003e\n  \u003cdiv class=\"wrap\"\u003e\n    \u003cp class=\"eyebrow reveal\"\u003ePreise \u0026amp; Leistungen\u003c\u002Fp\u003e\n    \u003ch2 class=\"h-section reveal\" id=\"preise-h\" data-d=\"1\"\u003eTransparente Konditionen, klare Leistungen\u003c\u002Fh2\u003e\n\n    \u003cdiv class=\"pricing\"\u003e\n      \u003cdiv class=\"price-card reveal\"\u003e\n        \u003cp class=\"tier\"\u003eEinzelgespräch\u003c\u002Fp\u003e\n        \u003cdiv class=\"amount\"\u003e70 €\u003csmall\u003e \u002F Gespräch\u003c\u002Fsmall\u003e\u003c\u002Fdiv\u003e\n        \u003cp class=\"dur\"\u003e60 Minuten · online per Video, Telefon oder WhatsApp\u003c\u002Fp\u003e\n        \u003ca class=\"btn btn--light\" href=\"#kontakt\"\u003eKontakt\u003c\u002Fa\u003e\n        \u003ca class=\"btn btn--outline-light\" style=\"margin-top:10px\" href=\"\u002Ftermin.php\"\u003eTermin buchen\u003c\u002Fa\u003e\n      \u003c\u002Fdiv\u003e\n\n      \u003cdiv class=\"services reveal\" data-d=\"1\"\u003e\n        \u003ch3\u003eInklusive Leistungen\u003c\u002Fh3\u003e\n        \u003cul\u003e\n          \u003cli\u003e\u003cspan class=\"tick\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"\u003e\u003cpath d=\"M5 13l4 4L19 7\"\u003e\u003c\u002Fpath\u003e\u003c\u002Fsvg\u003e\u003c\u002Fspan\u003ePsychologische Beratung online\u003c\u002Fli\u003e\n          \u003cli\u003e\u003cspan class=\"tick\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"\u003e\u003cpath d=\"M5 13l4 4L19 7\"\u003e\u003c\u002Fpath\u003e\u003c\u002Fsvg\u003e\u003c\u002Fspan\u003eGespräche zur inneren Klärung\u003c\u002Fli\u003e\n          \u003cli\u003e\u003cspan class=\"tick\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"\u003e\u003cpath d=\"M5 13l4 4L19 7\"\u003e\u003c\u002Fpath\u003e\u003c\u002Fsvg\u003e\u003c\u002Fspan\u003eUnterstützung in belastenden Lebenssituationen\u003c\u002Fli\u003e\n          \u003cli\u003e\u003cspan class=\"tick\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"\u003e\u003cpath d=\"M5 13l4 4L19 7\"\u003e\u003c\u002Fpath\u003e\u003c\u002Fsvg\u003e\u003c\u002Fspan\u003eReflexion \u0026amp; Orientierung\u003c\u002Fli\u003e\n          \u003cli\u003e\u003cspan class=\"tick\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"\u003e\u003cpath d=\"M5 13l4 4L19 7\"\u003e\u003c\u002Fpath\u003e\u003c\u002Fsvg\u003e\u003c\u002Fspan\u003eBegleitung der persönlichen Entwicklung\u003c\u002Fli\u003e\n        \u003c\u002Ful\u003e\n        \u003cp class=\"disclaimer\"\u003eDie Kosten werden nicht von den Krankenkassen übernommen. Es erfolgt keine Meldung an Krankenkassen oder andere Institutionen – Ihre Privatsphäre bleibt vollständig gewahrt.\u003c\u002Fp\u003e\n      \u003c\u002Fdiv\u003e\n    \u003c\u002Fdiv\u003e\n\n    \u003cdiv class=\"keyfacts reveal\"\u003e\n      \u003ch3\u003ePsychologische Beratung bei Selbstbetrachtung auf einen Blick\u003c\u002Fh3\u003e\n      \u003ctable\u003e\n        \u003ctbody\u003e\n          \u003ctr\u003e\u003cth scope=\"row\"\u003eLeistung\u003c\u002Fth\u003e\u003ctd\u003ePsychologische Beratung und Coaching für Erwachsene – zur Klärung, Reflexion und Orientierung\u003c\u002Ftd\u003e\u003c\u002Ftr\u003e\n          \u003ctr\u003e\u003cth scope=\"row\"\u003eAnbieterin\u003c\u002Fth\u003e\u003ctd\u003eGabriele Küppers, zertifizierte psychologische Beraterin (Personal Coach)\u003c\u002Ftd\u003e\u003c\u002Ftr\u003e\n          \u003ctr\u003e\u003cth scope=\"row\"\u003ePreis\u003c\u002Fth\u003e\u003ctd\u003e70 € pro Einzelgespräch\u003c\u002Ftd\u003e\u003c\u002Ftr\u003e\n          \u003ctr\u003e\u003cth scope=\"row\"\u003eDauer\u003c\u002Fth\u003e\u003ctd\u003e60 Minuten\u003c\u002Ftd\u003e\u003c\u002Ftr\u003e\n          \u003ctr\u003e\u003cth scope=\"row\"\u003eErstgespräch\u003c\u002Fth\u003e\u003ctd\u003eTelefonisch bis 15 Minuten – kostenlos und unverbindlich\u003c\u002Ftd\u003e\u003c\u002Ftr\u003e\n          \u003ctr\u003e\u003cth scope=\"row\"\u003eFormat\u003c\u002Fth\u003e\u003ctd\u003eVideoanruf, Telefon oder WhatsApp\u003c\u002Ftd\u003e\u003c\u002Ftr\u003e\n          \u003ctr\u003e\u003cth scope=\"row\"\u003eEinzugsgebiet\u003c\u002Fth\u003e\u003ctd\u003eDeutschlandweit online; Sitz in Mönchengladbach, Nordrhein-Westfalen\u003c\u002Ftd\u003e\u003c\u002Ftr\u003e\n          \u003ctr\u003e\u003cth scope=\"row\"\u003eSprache\u003c\u002Fth\u003e\u003ctd\u003eDeutsch\u003c\u002Ftd\u003e\u003c\u002Ftr\u003e\n          \u003ctr\u003e\u003cth scope=\"row\"\u003eAntwortzeit\u003c\u002Fth\u003e\u003ctd\u003eIn der Regel innerhalb 24 Stunden\u003c\u002Ftd\u003e\u003c\u002Ftr\u003e\n          \u003ctr\u003e\u003cth scope=\"row\"\u003eKostenübernahme\u003c\u002Fth\u003e\u003ctd\u003eSelbstzahler-Leistung ohne Krankenkassen-Erstattung; keine Meldung an Kassen, Arbeitgeber oder andere Institutionen\u003c\u002Ftd\u003e\u003c\u002Ftr\u003e\n          \u003ctr\u003e\u003cth scope=\"row\"\u003eTerminabsage\u003c\u002Fth\u003e\u003ctd\u003eBis 24 Stunden vorher kostenfrei\u003c\u002Ftd\u003e\u003c\u002Ftr\u003e\n          \u003ctr\u003e\u003cth scope=\"row\"\u003eAbgrenzung\u003c\u002Fth\u003e\u003ctd\u003eKeine Psychotherapie, keine Heilbehandlung, keine Diagnostik\u003c\u002Ftd\u003e\u003c\u002Ftr\u003e\n        \u003c\u002Ftbody\u003e\n      \u003c\u002Ftable\u003e\n    \u003c\u002Fdiv\u003e\n\n    \u003cdiv class=\"def reveal\"\u003e\n      \u003ch3\u003eWas kostet psychologische Beratung online?\u003c\u002Fh3\u003e\n      \u003cp\u003eBei Selbstbetrachtung kostet ein Einzelgespräch von 60 Minuten \u003cstrong\u003e70 Euro\u003c\u002Fstrong\u003e. Das telefonische Erstgespräch von bis zu 15 Minuten ist kostenlos. Abgerechnet wird nach dem Termin; die Rechnung ist innerhalb von 14 Tagen fällig. Bei Online-Beratungen kann eine Vorauszahlung vereinbart werden.\u003c\u002Fp\u003e\n      \u003cp\u003eDie Kosten für psychologische Beratung werden von den gesetzlichen Krankenkassen \u003cstrong\u003enicht übernommen\u003c\u002Fstrong\u003e, da es sich nicht um eine Heilbehandlung handelt. Dafür entfallen Antrag, Genehmigung und jede Meldung an Dritte.\u003c\u002Fp\u003e\n    \u003c\u002Fdiv\u003e\n  \u003c\u002Fdiv\u003e\n\u003c\u002Fsection\u003e\n\n\u003c!-- ===================== FAQ ===================== --\u003e\n\u003csection class=\"section section--band\" id=\"faq\" aria-labelledby=\"faq-h\"\u003e\n  \u003cdiv class=\"wrap\"\u003e\n    \u003cp class=\"eyebrow reveal\"\u003eHäufige Fragen\u003c\u002Fp\u003e\n    \u003ch2 class=\"h-section reveal\" id=\"faq-h\" data-d=\"1\"\u003eAntworten auf das, was viele beschäftigt\u003c\u002Fh2\u003e\n    \u003cp class=\"lead reveal\" data-d=\"2\"\u003eWenn Sie noch unsicher sind, finden Sie hier Antworten auf die Fragen, die mir am häufigsten gestellt werden. Bleibt etwas offen, schreiben Sie mir gern.\u003c\u002Fp\u003e\n\n    \u003cdiv class=\"faq reveal\"\u003e\n      \u003cdetails class=\"faq__item\"\u003e\n        \u003csummary\u003eIst die Beratung wirklich vertraulich?\u003c\u002Fsummary\u003e\n        \u003cdiv class=\"faq__a\"\u003e\u003cp\u003eJa. Alles, was Sie mir anvertrauen, bleibt selbstverständlich vertraulich. Es erfolgt keine Meldung an Krankenkassen, Arbeitgeber oder andere Institutionen. Sie entscheiden in jedem Gespräch selbst, was Sie teilen möchten.\u003c\u002Fp\u003e\u003c\u002Fdiv\u003e\n      \u003c\u002Fdetails\u003e\n      \u003cdetails class=\"faq__item\"\u003e\n        \u003csummary\u003eBrauche ich eine bestimmte App oder technische Vorkenntnisse?\u003c\u002Fsummary\u003e\n        \u003cdiv class=\"faq__a\"\u003e\u003cp\u003eNein. Die Beratung findet ganz unkompliziert per Video, Telefon oder WhatsApp statt – je nachdem, womit Sie sich am wohlsten fühlen. Sie benötigen lediglich ein Smartphone, Tablet oder einen Computer mit Internetverbindung.\u003c\u002Fp\u003e\u003c\u002Fdiv\u003e\n      \u003c\u002Fdetails\u003e\n      \u003cdetails class=\"faq__item\"\u003e\n        \u003csummary\u003eWas ist, wenn ich nicht weiß, ob mein Anliegen „passt\"?\u003c\u002Fsummary\u003e\n        \u003cdiv class=\"faq__a\"\u003e\u003cp\u003eDas ist völlig in Ordnung. Es gibt keine zu kleinen oder zu großen Themen. In einem kurzen Vorgespräch klären wir gemeinsam Ihr Anliegen und schauen in Ruhe, ob die Beratung das Richtige für Sie ist – ganz unverbindlich.\u003c\u002Fp\u003e\u003c\u002Fdiv\u003e\n      \u003c\u002Fdetails\u003e\n      \u003cdetails class=\"faq__item\"\u003e\n        \u003csummary\u003eIst eine psychologische Beratung dasselbe wie eine Psychotherapie?\u003c\u002Fsummary\u003e\n        \u003cdiv class=\"faq__a\"\u003e\u003cp\u003eNein. Die psychologische Beratung dient der persönlichen Klärung, Reflexion und Orientierung. Sie ersetzt keine ärztliche oder psychotherapeutische Behandlung und stellt keine Heilbehandlung im Sinne des Heilpraktikergesetzes dar. Bei einer akuten Erkrankung oder Krise wenden Sie sich bitte an ärztliche oder therapeutische Stellen.\u003c\u002Fp\u003e\u003c\u002Fdiv\u003e\n      \u003c\u002Fdetails\u003e\n      \u003cdetails class=\"faq__item\"\u003e\n        \u003csummary\u003eIst eine Online-Beratung genauso wirksam wie ein Gespräch vor Ort?\u003c\u002Fsummary\u003e\n        \u003cdiv class=\"faq__a\"\u003e\u003cp\u003eStudien zeigen vergleichbare Wirksamkeit zu Präsenzgesprächen. Viele Menschen öffnen sich sogar leichter aus der vertrauten Umgebung zu Hause statt in einer fremden Praxis.\u003c\u002Fp\u003e\u003c\u002Fdiv\u003e\n      \u003c\u002Fdetails\u003e\n      \u003cdetails class=\"faq__item\"\u003e\n        \u003csummary\u003eWie läuft die Bezahlung ab?\u003c\u002Fsummary\u003e\n        \u003cdiv class=\"faq__a\"\u003e\u003cp\u003eEin Einzelgespräch von 60 Minuten kostet 70 €. Die Kosten werden nicht von den Krankenkassen übernommen. Die Details zur Bezahlung besprechen wir im Vorfeld transparent miteinander.\u003c\u002Fp\u003e\u003c\u002Fdiv\u003e\n      \u003c\u002Fdetails\u003e\n      \u003cdetails class=\"faq__item\"\u003e\n        \u003csummary\u003eWie schnell bekomme ich eine Antwort?\u003c\u002Fsummary\u003e\n        \u003cdiv class=\"faq__a\"\u003e\u003cp\u003eIn der Regel antworte ich innerhalb von 24 Stunden auf Ihre Nachricht. Anschließend finden wir gemeinsam einen Termin, der gut in Ihren Alltag passt.\u003c\u002Fp\u003e\u003c\u002Fdiv\u003e\n      \u003c\u002Fdetails\u003e\n      \u003cdetails class=\"faq__item\"\u003e\n        \u003csummary\u003eMuss ich mit einer Wartezeit rechnen?\u003c\u002Fsummary\u003e\n        \u003cdiv class=\"faq__a\"\u003e\u003cp\u003ePsychologische Beratung ist nicht an die Vergabe von Kassen-Therapieplätzen gebunden: Es gibt keine Warteliste und keine Genehmigung durch eine Krankenkasse. Auf Ihre Nachricht antworte ich in der Regel innerhalb von 24 Stunden, den konkreten Termin stimmen wir anschließend individuell ab.\u003c\u002Fp\u003e\u003c\u002Fdiv\u003e\n      \u003c\u002Fdetails\u003e\n      \u003cdetails class=\"faq__item\"\u003e\n        \u003csummary\u003eWie viele Gespräche brauche ich?\u003c\u002Fsummary\u003e\n        \u003cdiv class=\"faq__a\"\u003e\u003cp\u003eEs gibt keine feste Mindestanzahl und keine Vertragsbindung. Manche Anliegen klären sich in einem einzigen Gespräch, andere brauchen eine Begleitung über mehrere Termine. Der Beratungsvertrag kann jederzeit und ohne Begründung von beiden Seiten beendet werden.\u003c\u002Fp\u003e\u003c\u002Fdiv\u003e\n      \u003c\u002Fdetails\u003e\n      \u003cdetails class=\"faq__item\"\u003e\n        \u003csummary\u003eKann ich anonym bleiben – entsteht ein Eintrag in einer Akte?\u003c\u002Fsummary\u003e\n        \u003cdiv class=\"faq__a\"\u003e\u003cp\u003eEs wird keine Diagnose gestellt, es entsteht kein Eintrag in einer medizinischen Akte und es erfolgt keine Meldung an Krankenkassen, Arbeitgeber oder andere Institutionen. Über den Gesprächsverlauf führe ich ein internes Protokoll, das ausschließlich der Dokumentation dient, der Schweigepflicht nach § 203 StGB unterliegt und in das Sie jederzeit Einsicht nehmen können. Sie entscheiden in jedem Gespräch selbst, was Sie von sich preisgeben.\u003c\u002Fp\u003e\u003c\u002Fdiv\u003e\n      \u003c\u002Fdetails\u003e\n      \u003cdetails class=\"faq__item\"\u003e\n        \u003csummary\u003eWerden die Gespräche aufgezeichnet?\u003c\u002Fsummary\u003e\n        \u003cdiv class=\"faq__a\"\u003e\u003cp\u003eNein. Eine Aufzeichnung der Beratungsgespräche erfolgt grundsätzlich nicht – weder per Videoanruf noch per Telefon.\u003c\u002Fp\u003e\u003c\u002Fdiv\u003e\n      \u003c\u002Fdetails\u003e\n      \u003cdetails class=\"faq__item\"\u003e\n        \u003csummary\u003eWie sicher ist die Kontaktaufnahme per WhatsApp?\u003c\u002Fsummary\u003e\n        \u003cdiv class=\"faq__a\"\u003e\u003cp\u003eWhatsApp-Nachrichten sind Ende-zu-Ende-verschlüsselt. Ihre Telefonnummer und die Metadaten verarbeitet WhatsApp jedoch eigenverantwortlich – darauf habe ich keinen Einfluss. Wenn Ihnen das wichtig ist, nutzen Sie für die Kontaktaufnahme bitte E-Mail oder Telefon. Das Beratungsgespräch selbst können Sie unabhängig davon per Videoanruf oder Telefon führen.\u003c\u002Fp\u003e\u003c\u002Fdiv\u003e\n      \u003c\u002Fdetails\u003e\n      \u003cdetails class=\"faq__item\"\u003e\n        \u003csummary\u003eWas gilt, wenn ich einen Termin absagen muss?\u003c\u002Fsummary\u003e\n        \u003cdiv class=\"faq__a\"\u003e\u003cp\u003eEinen vereinbarten Termin können Sie bis 24 Stunden vorher kostenlos absagen oder verschieben. Bei einer späteren Absage oder bei Nichterscheinen wird eine Ausfallgebühr in Höhe des vollen Honorars fällig.\u003c\u002Fp\u003e\u003c\u002Fdiv\u003e\n      \u003c\u002Fdetails\u003e\n      \u003cdetails class=\"faq__item\"\u003e\n        \u003csummary\u003eMuss ich nach Mönchengladbach kommen?\u003c\u002Fsummary\u003e\n        \u003cdiv class=\"faq__a\"\u003e\u003cp\u003eNein. Die Beratung findet vollständig online statt – per Videoanruf, Telefon oder WhatsApp. Der Sitz von Selbstbetrachtung ist Mönchengladbach, beraten wird deutschlandweit. Eine Praxis für persönliche Termine vor Ort gibt es nicht.\u003c\u002Fp\u003e\u003c\u002Fdiv\u003e\n      \u003c\u002Fdetails\u003e\n      \u003cdetails class=\"faq__item\"\u003e\n        \u003csummary\u003eWas tue ich in einer akuten Krise?\u003c\u002Fsummary\u003e\n        \u003cdiv class=\"faq__a\"\u003e\u003cp\u003eFür akute Krisen ist psychologische Beratung nicht das richtige Angebot. Wenn Sie sich in einer akuten Notlage befinden oder Suizidgedanken haben, wenden Sie sich bitte sofort an die Telefonseelsorge unter \u003ca href=\"tel:08001110111\"\u003e0800 111 0 111\u003c\u002Fa\u003e oder \u003ca href=\"tel:08001110222\"\u003e0800 111 0 222\u003c\u002Fa\u003e (kostenfrei, rund um die Uhr), an den ärztlichen Bereitschaftsdienst unter \u003ca href=\"tel:116117\"\u003e116 117\u003c\u002Fa\u003e oder im Notfall an den Notruf \u003ca href=\"tel:112\"\u003e112\u003c\u002Fa\u003e.\u003c\u002Fp\u003e\u003c\u002Fdiv\u003e\n      \u003c\u002Fdetails\u003e\n    \u003c\u002Fdiv\u003e\n\n    \u003caside class=\"crisis reveal\" aria-label=\"Hilfe in akuten Krisen\"\u003e\n      \u003cspan class=\"crisis__ico\" aria-hidden=\"true\"\u003e\n        \u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"\u003e\u003cpath d=\"M12 3 2.5 20h19z\"\u003e\u003c\u002Fpath\u003e\u003cpath d=\"M12 9.5v4\"\u003e\u003c\u002Fpath\u003e\u003cpath d=\"M12 17h.01\"\u003e\u003c\u002Fpath\u003e\u003c\u002Fsvg\u003e\n      \u003c\u002Fspan\u003e\n      \u003cdiv\u003e\n        \u003cb\u003eSie befinden sich in einer akuten Krise?\u003c\u002Fb\u003e\n        \u003cp\u003ePsychologische Beratung ersetzt keine ärztliche oder psychotherapeutische Behandlung. Bei akuter Not oder Suizidgedanken erhalten Sie sofort und kostenfrei Hilfe:\n        Telefonseelsorge \u003ca href=\"tel:08001110111\"\u003e0800 111 0 111\u003c\u002Fa\u003e oder \u003ca href=\"tel:08001110222\"\u003e0800 111 0 222\u003c\u002Fa\u003e (rund um die Uhr) ·\n        ärztlicher Bereitschaftsdienst \u003ca href=\"tel:116117\"\u003e116 117\u003c\u002Fa\u003e ·\n        Notruf \u003ca href=\"tel:112\"\u003e112\u003c\u002Fa\u003e.\u003c\u002Fp\u003e\n      \u003c\u002Fdiv\u003e\n    \u003c\u002Faside\u003e\n  \u003c\u002Fdiv\u003e\n\u003c\u002Fsection\u003e\n\n\u003c!-- ===================== TESTIMONIALS (Gerüst – 2026-08-14) =====================\n     BEREIT ZUM AKTIVIEREN, sobald ECHTE, freigegebene Kundenstimmen vorliegen.\n     Rechtlich\u002Fethisch: KEINE erfundenen Stimmen. Nur mit ausdrücklicher Freigabe\n     der Person veröffentlichen (idealerweise anonymisiert: Vorname + Anlass).\n     So aktivieren: die den Block umschliessenden Kommentar-Markierungen entfernen\n     (die Markierung oben und die Trennzeile unten) und die drei Platzhalter-Zitate\n     durch echte, freigegebene Stimmen ersetzen.\n\n\u003cstyle\u003e\n  #stimmen .h-section{margin-bottom:.5em}\n  .voices{display:grid;grid-template-columns:1fr;gap:18px;margin-top:26px}\n  @media(min-width:760px){.voices{grid-template-columns:1fr 1fr 1fr}}\n  .voice{background:var(--creme-card);border:1px solid var(--line-soft);border-radius:var(--radius);\n    padding:24px 24px 20px;box-shadow:var(--shadow-card);display:flex;flex-direction:column;gap:14px}\n  .voice__quote{font-family:var(--font-head);font-size:17px;line-height:1.55;color:var(--ink);margin:0}\n  .voice__quote::before{content:\"„\";color:var(--sand);font-size:26px;line-height:0;vertical-align:-2px;margin-right:2px}\n  .voice__who{font-size:13px;color:var(--ink-mute);letter-spacing:.02em;margin-top:auto}\n  .voice__stars{display:flex;gap:3px}\n  .voice__stars svg{width:15px;height:15px;fill:var(--sand);stroke:none}\n\u003c\u002Fstyle\u003e\n\u003csection class=\"section\" id=\"stimmen\"\u003e\n  \u003cdiv class=\"wrap\"\u003e\n    \u003cp class=\"eyebrow reveal\"\u003eStimmen\u003c\u002Fp\u003e\n    \u003ch2 class=\"h-section reveal\" data-d=\"1\"\u003eWas Klientinnen und Klienten sagen\u003c\u002Fh2\u003e\n    \u003cdiv class=\"voices\"\u003e\n      \u003cfigure class=\"voice reveal\"\u003e\n        \u003cp class=\"voice__quote\"\u003e[Echtes, freigegebenes Zitat einsetzen.]\u003c\u002Fp\u003e\n        \u003cfigcaption class=\"voice__who\"\u003e— Vorname, Anlass (z. B. „Neuorientierung\")\u003c\u002Ffigcaption\u003e\n      \u003c\u002Ffigure\u003e\n      \u003cfigure class=\"voice reveal\" data-d=\"1\"\u003e\n        \u003cp class=\"voice__quote\"\u003e[Echtes, freigegebenes Zitat einsetzen.]\u003c\u002Fp\u003e\n        \u003cfigcaption class=\"voice__who\"\u003e— Vorname, Anlass\u003c\u002Ffigcaption\u003e\n      \u003c\u002Ffigure\u003e\n      \u003cfigure class=\"voice reveal\" data-d=\"2\"\u003e\n        \u003cp class=\"voice__quote\"\u003e[Echtes, freigegebenes Zitat einsetzen.]\u003c\u002Fp\u003e\n        \u003cfigcaption class=\"voice__who\"\u003e— Vorname, Anlass\u003c\u002Ffigcaption\u003e\n      \u003c\u002Ffigure\u003e\n    \u003c\u002Fdiv\u003e\n  \u003c\u002Fdiv\u003e\n\u003c\u002Fsection\u003e\n================================================================================ --\u003e\n\n\u003c!-- ===================== KONTAKT ===================== --\u003e\n\u003csection class=\"section section--dark\" id=\"kontakt\" aria-labelledby=\"kontakt-h\"\u003e\n  \u003cdiv class=\"wrap\"\u003e\n    \u003cp class=\"eyebrow reveal\"\u003eKontaktmöglichkeiten\u003c\u002Fp\u003e\n    \u003ch2 class=\"h-section reveal\" id=\"kontakt-h\" data-d=\"1\"\u003eSchreiben Sie mir – der erste Schritt ist unverbindlich\u003c\u002Fh2\u003e\n    \u003cp class=\"lead reveal\" data-d=\"2\"\u003eWenn Sie das Gefühl haben, dass Ihnen ein klärendes Gespräch guttun würde, freue ich mich über Ihre Nachricht. Sie entscheiden, was Sie teilen möchten.\u003c\u002Fp\u003e\n\n    \u003cdiv class=\"contact-grid\"\u003e\n      \u003ca class=\"contact-card reveal\" href=\"mailto:kontakt@selbstbetrachtung-online.de\"\u003e\n        \u003cspan class=\"ico\" aria-hidden=\"true\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"\u003e\u003crect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"\u003e\u003c\u002Frect\u003e\u003cpath d=\"m3 7 9 6 9-6\"\u003e\u003c\u002Fpath\u003e\u003c\u002Fsvg\u003e\u003c\u002Fspan\u003e\n        \u003cspan\u003e\u003cspan class=\"k\"\u003eE-Mail\u003c\u002Fspan\u003e\u003cspan class=\"v\"\u003ekontakt@selbstbetrachtung-online.de\u003c\u002Fspan\u003e\u003c\u002Fspan\u003e\n      \u003c\u002Fa\u003e\n      \u003ca class=\"contact-card reveal\" data-d=\"1\" href=\"/whatsapp.php\" target=\"_blank\" rel=\"noopener\"\u003e\n        \u003cspan class=\"ico\" aria-hidden=\"true\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"\u003e\u003cpath d=\"M21 11.5a8.38 8.38 0 0 1-9 8.38 8.5 8.5 0 0 1-3.9-.94L3 20l1.06-4.1A8.38 8.38 0 0 1 12 3a8.5 8.5 0 0 1 9 8.5z\"\u003e\u003c\u002Fpath\u003e\u003c\u002Fsvg\u003e\u003c\u002Fspan\u003e\n        \u003cspan\u003e\u003cspan class=\"k\"\u003eWhatsApp\u003c\u002Fspan\u003e\u003cspan class=\"v obf-tel\" data-t=\"55,56,60,56,39,59,56,58,60,62,57,63,56\"\u003e\u003c\u002Fspan\u003e\u003c\u002Fspan\u003e\n      \u003c\u002Fa\u003e\n    \u003c\u002Fdiv\u003e\n    \u003cp class=\"contact-note reveal\"\u003e\u003cspan class=\"pulse\" aria-hidden=\"true\"\u003e\u003c\u002Fspan\u003eAntwort in der Regel innerhalb von 24 Stunden.\u003c\u002Fp\u003e\n\n    \u003cform class=\"contact-form reveal\" id=\"contactForm\" novalidate=\"\"\u003e\n      \u003cdiv style=\"position:absolute;left:-9999px;top:-9999px\" aria-hidden=\"true\"\ 2Fp\u003e\n    \u003cp\u003eSteuernummer: 121\u002F5225\u002F6707\u003c\u002Fp\u003e\n\n    \u003ch3\u003eVerantwortlich für den Inhalt nach § 18 Abs. 2 MStV\u003c\u002Fh3\u003e\n    \u003cp\u003eGabriele Küppers, Dachsweg 27, 41189 Mönchengladbach\u003c\u002Fp\u003e\n\n    \u003ch3\u003eEU-Streitschlichtung\u003c\u002Fh3\u003e\n    \u003cp\u003eDie Europäische Kommission stellt eine Plattform zur Online-Streitbeilegung (OS) bereit: \u003ca href=\"https:\u002F\u002Fec.europa.eu\u002Fconsumers\u002Fodr\" target=\"_blank\" rel=\"noopener\"\u003ehttps:\u002F\u002Fec.europa.eu\u002Fconsumers\u002Fodr\u003c\u002Fa\u003e. Unsere E-Mail-Adresse finden Sie oben.\u003c\u002Fp\u003e\n\n    \u003ch3\u003eVerbraucherstreitbeilegung\u003c\u002Fh3\u003e\n    \u003cp\u003eIch bin nicht bereit und nicht verpflichtet, an Streitbeilegungsverfahren vor einer Verbraucherschlichtungsstelle teilzunehmen.\u003c\u002Fp\u003e\n\n    \u003ch3\u003eHinweis zu psychologischer Beratung\u003c\u002Fh3\u003e\n    \u003cp\u003ePsychologische Beratung und Coaching ersetzen keine Psychotherapie oder medizinische Behandlung. Es werden keine Diagnosen, Heilversprechen oder Zusagen zur Linderung von Erkrankungen abgegeben.\u003c\u002Fp\u003e\n  \u003c\u002Fdiv\u003e\n\u003c\u002Fsection\u003e\n\n\u003csection class=\"section section--band legal\" id=\"datenschutz\"\u003e\n  \u003cdiv class=\"wrap\"\u003e\n    \u003cp class=\"eyebrow\"\u003eRechtliches\u003c\u002Fp\u003e\n    \u003ch2 class=\"h-section\"\u003eDatenschutzerklärung\u003c\u002Fh2\u003e\n\n    \u003ch3\u003e1. Verantwortliche Stelle\u003c\u002Fh3\u003e\n    \u003cp\u003eVerantwortlich für die Datenverarbeitung auf dieser Website ist:\u003c\u002Fp\u003e\n    \u003caddress\u003e\n      \u003cstrong\u003eGabriele Küppers\u003c\u002Fstrong\u003e\u003cbr\u003e\n      Psychologische Beratung \u002F Coaching\u003cbr\u003e\n      Dachsweg 27\u003cbr\u003e\n      41189 Mönchengladbach\u003cbr\u003e\n      Deutschland\n    \u003c\u002Faddress\u003e\n    \u003cp\u003eTelefon: \u003cspan class=\"obf-tel\" data-t=\"50,59,64,39,47,55,48,56,60,56,39,59,56,58,60,39,62,57,63,56\"\u003e\u003c\u002Fspan\u003e\u003cbr\u003e\n       E-Mail: \u003ca href=\"mailto:kontakt@selbstbetrachtung-online.de\"\u003ekontakt@selbstbetrachtung-online.de\u003c\u002Fa\u003e\u003c\u002Fp\u003e\n    \u003cp\u003eVerantwortliche Stelle ist die natürliche oder juristische Person, die allein oder gemeinsam mit anderen über die Zwecke und Mittel der Verarbeitung von personenbezogenen Daten (z.\u0026nbsp;B. Namen, E-Mail-Adressen o.\u0026nbsp;Ä.) entscheidet.\u003c\u002Fp\u003e\n\n    \u003ch3\u003e2. Allgemeine Hinweise\u003c\u002Fh3\u003e\n    \u003cp\u003eDer Schutz Ihrer persönlichen Daten ist uns ein wichtiges Anliegen. Wir behandeln Ihre personenbezogenen Daten vertraulich und entsprechend den gesetzlichen Datenschutzvorschriften sowie dieser Datenschutzerklärung.\u003c\u002Fp\u003e\n    \u003cp\u003ePersonenbezogene Daten sind alle Daten, mit denen Sie persönlich identifiziert werden können.\u003c\u002Fp\u003e\n\n    \u003ch3\u003e3. Erfassung allgemeiner Informationen beim Besuch der Website\u003c\u002Fh3\u003e\n    \u003cp\u003eBeim Besuch dieser Website werden durch den Hosting-Anbieter automatisch Informationen erfasst und in sogenannten Server-Logfiles gespeichert. Hierzu gehören insbesondere:\u003c\u002Fp\u003e\n    \u003cul\u003e\n      \u003cli\u003eIP-Adresse\u003c\u002Fli\u003e\n      \u003cli\u003eDatum und Uhrzeit des Zugriffs\u003c\u002Fli\u003e\n      \u003cli\u003eBrowsertyp und Browserversion\u003c\u002Fli\u003e\n      \u003cli\u003everwendetes Betriebssystem\u003c\u002Fli\u003e\n      \u003cli\u003eReferrer-URL\u003c\u002Fli\u003e\n      \u003cli\u003eaufgerufene Seiten und Dateien\u003c\u002Fli\u003e\n    \u003c\u002Ful\u003e\n    \u003cp\u003eDiese Daten dienen ausschließlich der Sicherstellung eines störungsfreien Betriebs der Website und der Verbesserung unseres Angebots. Rechtsgrundlage ist Art. 6 Abs. 1 lit. f DSGVO.\u003c\u002Fp\u003e\n    \u003ch4\u003eCookies und Session Storage\u003c\u002Fh4\u003e\n    \u003cp\u003eDiese Webseite verwendet keine Cookies.\u003c\u002Fp\u003e\n    \u003ch4\u003eEinsatz von Webalizer\u003c\u002Fh4\u003e\n    \u003cp\u003eAuf dieser Webseite nutzen wir Webalizer für die Analyse des Nutzerverhaltens. Wir sind durch die Auswertung der gewonnenen statistischen Daten (z.\u0026nbsp;B. die am häufigsten besuchten Webseiten-Inhalte, die am häufigsten genutzten Browser, die Länder, aus denen die meisten Abfragen stammen) in der Lage, Informationen über die Nutzung der einzelnen Komponenten unserer Webseite zusammenzustellen. Dies hilft uns dabei, unsere Webseite und deren Nutzerfreundlichkeit zu verbessern. Die erhobenen Nutzerdaten werden nicht zur Erstellung von Nutzerprofilen verwendet. In der von uns verwendeten Variante arbeitet Webalizer mit einer Anonymisierung von IP-Adressen. Dabei werden die IP-Adressen vor einer etwaigen Nutzung für die Analyse des Nutzungsverhaltens um die letzten drei Stellen gekürzt, sodass ein Personenbezug nicht mehr herstellbar ist und Sie als Nutzer für uns anonym bleiben.\u003c\u002Fp\u003e\n    \u003cp\u003eDie anonymisierten Datensätze werden auf unserem Webserver gespeichert und ausschließlich zu statistischen Zwecken hausintern ausgewertet. Eine Weitergabe dieser Daten an Dritte findet zu keinem Zeitpunkt statt. Die Daten werden gelöscht, sobald sie für die Erreichung des Zweckes ihrer Erhebung nicht mehr erforderlich sind. Das Webalizer-Analysetool nutzt keine Cookies.\u003c\u002Fp\u003e\n\n    \u003ch3\u003e4. Hosting\u003c\u002Fh3\u003e\n    \u003cp\u003eWir hosten die Inhalte unserer Website bei folgendem Anbieter:\u003c\u002Fp\u003e\n    \u003ch4\u003eExternes Hosting\u003c\u002Fh4\u003e\n    \u003cp\u003eDiese Website wird extern gehostet. Die personenbezogenen Daten, die auf dieser Website erfasst werden, werden auf den Servern des Hosters \u002F der Hoster gespeichert. Hierbei kann es sich v.\u0026nbsp;a.
