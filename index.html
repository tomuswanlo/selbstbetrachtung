bermittelten Daten einschließlich Ihrer Kontaktdaten zum Zweck der Bearbeitung Ihrer Anfrage gespeichert und verarbeitet.\u003c\u002Fp\u003e\n    \u003cp\u003eDiese Daten geben wir nicht ohne Ihre Einwilligung weiter; die Einwilligung ist jederzeit widerrufbar.\u003c\u002Fp\u003e\n    \u003cp\u003eDie Verarbeitung erfolgt auf Grundlage von Art. 6 Abs. 1 lit. b DSGVO, sofern Ihre Anfrage auf die Anbahnung oder Durchführung einer Beratungsleistung gerichtet ist. In allen anderen Fällen erfolgt die Verarbeitung auf Grundlage unseres berechtigten Interesses gemäß Art. 6 Abs. 1 lit. f DSGVO.\u003c\u002Fp\u003e\n    \u003cp\u003eDie Daten werden gelöscht, sobald die Bearbeitung abgeschlossen ist und keine gesetzlichen Aufbewahrungspflichten bestehen.\u003c\u002Fp\u003e\n\n    \u003cp\u003eZum Schutz vor missbräuchlicher automatisierter Nutzung setzen wir hierbei Cloudflare Turnstile ein; nähere Informationen dazu finden Sie unter Abschnitt 15 (Plugins und Tools).\u003c\u002Fp\u003e\n\n    \u003ch3\u003e6. Kontaktaufnahme per WhatsApp\u003c\u002Fh3\u003e\n    \u003cp\u003eWir bieten die Möglichkeit der Kontaktaufnahme über den Messenger-Dienst WhatsApp an. Bei der Nutzung von WhatsApp werden insbesondere Ihre Telefonnummer sowie die von Ihnen übermittelten Nachrichten verarbeitet.\u003c\u002Fp\u003e\n    \u003cp\u003eBitte beachten Sie, dass WhatsApp personenbezogene Daten eigenverantwortlich verarbeitet. Auf die Datenverarbeitung durch WhatsApp haben wir keinen Einfluss.\u003c\u002Fp\u003e\n    \u003cp\u003eDie Kontaktaufnahme über WhatsApp erfolgt freiwillig und auf Grundlage Ihrer Einwilligung bzw. Ihrer Anfrage gemäß Art. 6 Abs. 1 lit. a und b DSGVO. Weitere Informationen zur Datenverarbeitung durch WhatsApp finden Sie in den Datenschutzbestimmungen des Anbieters.\u003c\u002Fp\u003e\n\n    \u003ch3\u003e7. Online-Terminvergabe\u003c\u002Fh3\u003e\n    \u003cp\u003eAuf unserer Website bieten wir Ihnen die Möglichkeit, über ein Online-Formular direkt einen Beratungstermin zu vereinbaren. Hierbei werden von Ihnen folgende Daten erhoben und verarbeitet: Name, E-Mail-Adresse, optional Telefonnummer und eine optionale Nachricht sowie die von Ihnen gewählte Terminart und der gewünschte Termin (Datum/Uhrzeit).\u003c\u002Fp\u003e\n    \u003cp\u003eDie Verarbeitung erfolgt ausschließlich zum Zweck der Vereinbarung, Bestätigung und Verwaltung Ihres Beratungstermins, einschließlich einer automatischen Bestätigungs-E-Mail und der Möglichkeit, den Termin über einen personalisierten Link eigenständig wieder abzusagen. Rechtsgrundlage ist Art. 6 Abs. 1 lit. b DSGVO (Vertragserfüllung bzw. vorvertragliche Maßnahmen).\u003c\u002Fp\u003e\n    \u003cp\u003eDie erhobenen Daten werden auf unserem in Abschnitt 4 genannten Server gespeichert und sind ausschließlich für uns als Verantwortliche über einen passwortgeschützten Zugang einsehbar. Eine Weitergabe an Dritte erfolgt nicht, mit Ausnahme des zum Versand der Bestätigungs-E-Mails genutzten E-Mail-Providers.\u003c\u002Fp\u003e\n    \u003cp\u003eZum Schutz vor missbräuchlicher automatisierter Nutzung setzen wir bei der Terminvergabe denselben Sicherheitsdienst ein wie beim Kontaktformular; nähere Informationen dazu finden Sie unter Abschnitt 15 (Plugins und Tools).\u003c\u002Fp\u003e\n    \u003cp\u003eIhre Termindaten werden gelöscht, sobald der Termin wahrgenommen bzw. storniert wurde und keine weitere Aufbewahrung erforderlich ist, spätestens jedoch drei Monate nach dem Termin, sofern keine gesetzlichen Aufbewahrungspflichten entgegenstehen.\u003c\u002Fp\u003e\n\n    \u003ch3\u003e8. Durchführung von Beratungen\u003c\u002Fh3\u003e\n    \u003cp\u003eIm Rahmen unserer Beratungsangebote können personenbezogene Daten verarbeitet werden, die Sie uns freiwillig mitteilen. Die Verarbeitung erfolgt ausschließlich zur Durchführung der vereinbarten Beratung und Kommunikation. Rechtsgrundlage ist Art. 6 Abs. 1 lit. b DSGVO. Wir behandeln alle im Rahmen der Beratung erhaltenen Informationen vertraulich.\u003c\u002Fp\u003e\n\n    \u003ch3\u003e9. Beratung per Videoanruf\u003c\u002Fh3\u003e\n    \u003cp\u003eBeratungsgespräche können nach Vereinbarung per Videoanruf durchgeführt werden. Hierbei werden die zur Durchführung des Gesprächs erforderlichen personenbezogenen Daten verarbeitet. Dazu können insbesondere Name, Kontaktdaten sowie Gesprächsinhalte gehören. Eine Aufzeichnung der Gespräche erfolgt grundsätzlich nicht. Die Verarbeitung erfolgt auf Grundlage von Art. 6 Abs. 1 lit. b DSGVO.\u003c\u002Fp\u003e\n\n    \u003ch3\u003e10. Hinweis zum Beratungsangebot\u003c\u002Fh3\u003e\n    \u003cp\u003eDie angebotenen Leistungen dienen der persönlichen Orientierung, Reflexion und Lebenshilfe. Sie stellen keine Psychotherapie, Heilbehandlung, medizinische Beratung oder Diagnostik dar und ersetzen keine ärztliche oder psychotherapeutische Behandlung. Bei psychischen Erkrankungen, akuten Krisensituationen oder medizinischen Fragestellungen wenden Sie sich bitte an entsprechend qualifizierte Fachpersonen oder geeignete Hilfsangebote.\u003c\u002Fp\u003e\n\n    \u003ch3\u003e11. Speicherdauer\u003c\u002Fh3\u003e\n    \u003cp\u003ePersonenbezogene Daten werden nur so lange gespeichert, wie dies für die jeweiligen Verarbeitungszwecke erforderlich ist oder gesetzliche Aufbewahrungspflichten bestehen. Nach Wegfall des Verarbeitungszwecks werden die Daten gelöscht, sofern keine gesetzlichen Aufbewahrungsfristen entgegenstehen.\u003c\u002Fp\u003e\n\n    \u003ch3\u003e12. Ihre Rechte\u003c\u002Fh3\u003e\n    \u003cp\u003eSie haben im Rahmen der geltenden gesetzlichen Bestimmungen jederzeit das Recht auf:\u003c\u002Fp\u003e\n    \u003cul\u003e\n      \u003cli\u003eAuskunft über Ihre gespeicherten Daten\u003c\u002Fli\u003e\n      \u003cli\u003eBerichtigung unrichtiger Daten\u003c\u002Fli\u003e\n      \u003cli\u003eLöschung Ihrer Daten\u003c\u002Fli\u003e\n      \u003cli\u003eEinschränkung der Verarbeitung\u003c\u002Fli\u003e\n      \u003cli\u003eDatenübertragbarkeit\u003c\u002Fli\u003e\n      \u003cli\u003eWiderruf erteilter Einwilligungen\u003c\u002Fli\u003e\n      \u003cli\u003eWiderspruch gegen die Verarbeitung Ihrer Daten\u003c\u002Fli\u003e\n    \u003c\u002Ful\u003e\n    \u003cp\u003eZur Ausübung Ihrer Rechte können Sie sich jederzeit an die oben genannte verantwortliche Stelle wenden.\u003c\u002Fp\u003e\n\n    \u003ch3\u003e13. Beschwerderecht bei einer Aufsichtsbehörde\u003c\u002Fh3\u003e\n    \u003cp\u003eSie haben das Recht, sich bei einer Datenschutzaufsichtsbehörde über die Verarbeitung Ihrer personenbezogenen Daten zu beschweren.\u003c\u002Fp\u003e\n\n    \u003ch3\u003e14. SSL- bzw. TLS-Verschlüsselung\u003c\u002Fh3\u003e\n    \u003cp\u003eDiese Website nutzt aus Sicherheitsgründen eine SSL- bzw. TLS-Verschlüsselung. Dadurch können Daten, die Sie an uns übermitteln, nicht von Dritten mitgelesen werden.\u003c\u002Fp\u003e\n\n    \u003ch3\u003e15. Plugins und Tools\u003c\u002Fh3\u003e\n    \u003ch4\u003eGoogle Fonts (lokales Hosting)\u003c\u002Fh4\u003e\n    \u003cp\u003eDiese Seite nutzt zur einheitlichen Darstellung von Schriftarten so genannte Google Fonts, die von Google bereitgestellt werden. Die Google Fonts sind lokal installiert. Eine Verbindung zu Servern von Google findet dabei nicht statt.\u003c\u002Fp\u003e\n    \u003cp\u003eWeitere Informationen zu Google Fonts finden Sie unter \u003ca href=\"https:\u002F\u002Fdevelopers.google.com\u002Ffonts\u002Ffaq\" target=\"_blank\" rel=\"noopener\"\u003edevelopers.google.com\u002Ffonts\u002Ffaq\u003c\u002Fa\u003e und in der Datenschutzerklärung von Google: \u003ca href=\"https:\u002F\u002Fpolicies.google.com\u002Fprivacy?hl=de\" target=\"_blank\" rel=\"noopener\"\u003epolicies.google.com\u002Fprivacy\u003c\u002Fa\u003e.\u003c\u002Fp\u003e\n\n    \u003ch4\u003eCloudflare Turnstile\u003c\u002Fh4\u003e\n    \u003cp\u003eZum Schutz unseres Kontaktformulars und der Online-Terminvergabe vor missbräuchlicher automatisierter Nutzung (Spam) setzen wir den Dienst „Cloudflare Turnstile\" der Cloudflare, Inc., 101 Townsend St, San Francisco, CA 94107, USA, ein.\u003c\u002Fp\u003e\n    \u003cp\u003eDabei wird unter anderem Ihre IP-Adresse an Cloudflare übermittelt und dort verarbeitet, um automatisierte Zugriffe (Bots) von menschlichen Nutzern zu unterscheiden, ohne dass Sie ein klassisches CAPTCHA lösen müssen. Die Verarbeitung erfolgt auf Grundlage unseres berechtigten Interesses an einem vor Missbrauch geschützten Kontakt- und Buchungsangebot (Art. 6 Abs. 1 lit. f DSGVO).\u003c\u002Fp\u003e\n    \u003cp\u003eEine Übermittlung von Daten in die USA kann dabei nicht ausgeschlossen werden. Weitere Informationen erhalten Sie in der Datenschutzerklärung von Cloudflare: \u003ca href=\"https:\u002F\u002Fwww.cloudflare.com\u002Fprivacypolicy\u002F\" target=\"_blank\" rel=\"noopener\"\u003ewww.cloudflare.com\u002Fprivacypolicy\u002F\u003c\u002Fa\u003e.\u003c\u002Fp\u003e\n\n    \u003ch3\u003e16. Änderungen dieser Datenschutzerklärung\u003c\u002Fh3\u003e\n    \u003cp\u003eWir behalten uns vor, diese Datenschutzerklärung anzupassen, damit sie stets den aktuellen rechtlichen Anforderungen entspricht oder um Änderungen unserer Leistungen in der Datenschutzerklärung umzusetzen. Für Ihren erneuten Besuch gilt dann die jeweils aktuelle Datenschutzerklärung.\u003c\u002Fp\u003e\n    \u003cp class=\"legal-updated\"\u003eStand: 18.08.2026\u003c\u002Fp\u003e\n  \u003c\u002Fdiv\u003e\n\u003c\u002Fsection\u003e\n\n\u003csection class=\"section legal\" id=\"agb\"\u003e\n  \u003cdiv class=\"wrap\"\u003e\n    \u003cp class=\"eyebrow\"\u003eRechtliches\u003c\u002Fp\u003e\n    \u003ch2 class=\"h-section\"\u003eAllgemeine Geschäftsbedingungen (AGB)\u003c\u002Fh2\u003e\n\n    \u003ch3\u003e1. Allgemeines\u003c\u002Fh3\u003e\n    \u003cp\u003e1.1. Diese Allgemeinen Geschäftsbedingungen (AGB) regeln das Vertragsverhältnis zwischen Selbstbetrachtung \u002F Gabriele Küppers (Inhaberin) und den Klienten (im Folgenden „Klient\" genannt) in Bezug auf die angebotenen psychologischen Beratungsleistungen.\u003c\u002Fp\u003e\n    \u003cp\u003e1.2. Mit der Inanspruchnahme unserer Leistungen erkennt der Klient diese AGB an.\u003c\u002Fp\u003e\n    \u003cp\u003e1.3. Abweichende Geschäftsbedingungen des Klienten finden keine Anwendung, es sei denn, sie wurden von Selbstbetrachtung \u002F Gabriele Küppers ausdrücklich schriftlich anerkannt.\u003c\u002Fp\u003e\n\n    \u003ch3\u003e2. Beratungsleistungen\u003c\u002Fh3\u003e\n    \u003cp\u003e2.1. Selbstbetrachtung \u002F Gabriele Küppers bietet psychologische Beratungsleistungen zu beruflichen und persönlichen Themen an. Die Beratung erfolgt in Form von Einzelgesprächen, die vor Ort, telefonisch oder online stattfinden können.\u003c\u002Fp\u003e\n    \u003cp\u003e2.2. Die Beratung stellt keine Psychotherapie dar und ersetzt nicht den Besuch bei einem Arzt, Therapeuten oder Psychotherapeuten. In Fällen, in denen therapeutische Hilfe erforderlich ist, wird der Klient darauf hingewiesen, sich an entsprechende Fachpersonen zu wenden.\u003c\u002Fp\u003e\n    \u003cp\u003e2.3. Der Klient ist für seine Handlungen und Entscheidungen während und nach der Beratung selbst verantwortlich.\u003c\u002Fp\u003e\n\n    \u003ch3\u003e3. Vertragsschluss\u003c\u002Fh3\u003e\n    \u003cp\u003e3.1. Der Vertrag zwischen dem Klienten und Selbstbetrachtung \u002F Gabriele Küppers kommt zustande, sobald ein Beratungstermin vereinbart und bestätigt wurde.\u003c\u002Fp\u003e\n    \u003cp\u003e3.2. Die Vereinbarung eines Termins kann telefonisch, per E-Mail oder über ein Online-Buchungssystem erfolgen. Eine Terminbestätigung erfolgt schriftlich (z.\u0026nbsp;B. per E-Mail).\u003c\u002Fp\u003e\n\n    \u003ch3\u003e4. Mitwirkungspflichten – Verantwortung der Klientin \u002F des Klienten\u003c\u002Fh3\u003e\n    \u003cp\u003e4.1. Der Klient erkennt an, dass alle Schritte und Maßnahmen, die im Zuge der Therapie \u002F Beratung \u002F Coaching von ihm durchgeführt werden, in seinem eigenen Verantwortungsbereich liegen.\u003c\u002Fp\u003e\n    \u003cp\u003e4.2. Die Dienstleistung beruht auf Kooperation und gegenseitigem Vertrauen. Die Therapeutin \u002F Beraterin \u002F Coach macht darauf aufmerksam, dass Systemische Beratung, Therapie und Coaching ein freier, aktiver und selbstverantwortlicher Prozess ist und ein bestimmter oder zielgerichteter Erfolg nicht versprochen werden kann. Die Therapeutin \u002F Beraterin \u002F Coach steht dem Klienten als Prozessbegleiterin und als Unterstützung bei eigenen Entscheidungen und Veränderungen zur Seite – die Veränderungsarbeit selbst wird von den Klienten geleistet.\u003c\u002Fp\u003e\n    \u003cp\u003e4.3. Der Klient ist für seine physische und psychische Gesundheit sowohl während der Sitzung als auch in der Phase zwischen den Terminen in vollem Umfang selbst verantwortlich. Sämtliche Maßnahmen, die der Klient aufgrund der Dienstleistung durchführt, liegen in seinem eigenen Verantwortungsbereich.\u003c\u002Fp\u003e\n\n    \u003ch3\u003e5. Verantwortung der Beraterin \u002F des Coaches – Verschwiegenheit\u003c\u002Fh3\u003e\n    \u003cp\u003e5.1. Die Beraterin und Coach wird die eingesetzten Methoden und Techniken dem Klienten zu jedem Zeitpunkt der Dienstleistung erläutern sowie ggf. auf mögliche Risiken und Ergebnisse hinweisen. Es sei darauf hingewiesen, dass Beratung und Coaching möglicherweise neue Sichtweisen, Beziehungen und Kommunikation im Leben der Klientin \u002F des Klienten schafft. Die Klientin \u002F der Klient experimentiert wahrscheinlich mit dem neuen Beziehungs- und Kommunikationsverhalten. Dadurch kann die Umgebung insgesamt in einen Lernprozess geraten, der sowohl positive wie auch negative Auswirkungen haben kann.\u003c\u002Fp\u003e\n    \u003cp\u003e5.2. Alle Informationen werden von der Beraterin \u002F Coach vertraulich behandelt, nicht an Dritte weitergegeben und vor dem Zugriff Dritter geschützt. Sie dienen lediglich dem vereinbarten Dienstleistungsverhältnis. Die Informationsweitergabe an Dritte bedarf der schriftlichen Zustimmung des Klienten (Schweigepflichtentbindung gem. § 203 StGB). Lediglich im Rahmen der selbstreflektierenden Supervision und Intervision der Beraterin \u002F Coach können in anonymisierter Form Fälle zum Zweck der Qualitätserhöhung des Beratungsangebots aufgenommen werden.\u003c\u002Fp\u003e\n    \u003cp\u003e5.3. Über die Dienstleistung wird von der Beraterin \u002F Coach ein Protokoll (z.\u0026nbsp;B. Gesprächsprotokolle) geführt, um den Verlauf und den Fortschritt zu dokumentieren. Dies dient dem Schutz beider Parteien. Der Klient hat auf Verlangen jederzeit Einsicht.\u003c\u002Fp\u003e\n    \u003cp\u003e5.4. Ich bin zertifiziertes Mitglied des Verbands VFP – Verband Freier Psychotherapeuten, Heilpraktiker für Psychotherapie und Psychologischer Berater e.V. und halte mich an deren ethischen Richtlinien.\u003c\u002Fp\u003e\n\n    \u003ch3\u003e6. Gebühren und Zahlungsbedingungen\u003c\u002Fh3\u003e\n    \u003cp\u003e6.1. Die Beratung wird gemäß dem aktuell gültigen Honorarsatz abgerechnet. Derzeit beträgt das Honorar 70 Euro pro Stunde. Die telefonische Erstberatung bis 15\u0026nbsp;Minuten ist kostenlos.\u003c\u002Fp\u003e\n    \u003cp\u003e6.2. Die Abrechnung erfolgt nach dem Beratungstermin. Die Rechnung ist innerhalb von 14 Tagen nach Erhalt ohne Abzug fällig.\u003c\u002Fp\u003e\n    \u003cp\u003e6.3. Bei Online-Beratungen kann eine Vorauszahlung per Überweisung oder ein anderes vereinbartes Zahlungsmittel erforderlich sein.\u003c\u002Fp\u003e\n    \u003cp\u003e6.4. Wird der Zahlungstermin nicht eingehalten, behält sich Selbstbetrachtung \u002F Gabriele Küppers das Recht vor, Mahngebühren zu erheben.\u003c\u002Fp\u003e\n\n    \u003ch3\u003e7. Terminabsagen und Stornierung\u003c\u002Fh3\u003e\n    \u003cp\u003e7.1. Der Klient kann einen vereinbarten Termin bis 24 Stunden vor dem Termin kostenlos stornieren oder verschieben.\u003c\u002Fp\u003e\n    \u003cp\u003e7.2. Bei einer Absage innerhalb von 24 Stunden vor dem vereinbarten Termin oder bei Nichterscheinen wird eine Ausfallgebühr in Höhe des vollen Honorars fällig.\u003c\u002Fp\u003e\n    \u003cp\u003e7.3. Der abgeschlossene Beratungsvertrag (Beratung \u002F Coaching) kann jederzeit, ohne dass es einer Begründung bedarf, von beiden Seiten gekündigt werden, z.\u0026nbsp;B. per E-Mail.\u003c\u002Fp\u003e\n\n    \u003ch3\u003e8. Vertraulichkeit und Datenschutz\u003c\u002Fh3\u003e\n    \u003cp\u003e8.1. Alle Informationen, die im Rahmen der Beratung ausgetauscht werden, unterliegen der Schweigepflicht. Selbstbetrachtung \u002F Gabriele Küppers verpflichtet sich, alle persönlichen Daten und Informationen des Klienten vertraulich zu behandeln.\u003c\u002Fp\u003e\n    \u003cp\u003e8.2. Die Verarbeitung personenbezogener Daten erfolgt in Übereinstimmung mit der Datenschutzerklärung von Selbstbetrachtung \u002F Gabriele Küppers und den geltenden Datenschutzgesetzen.\u003c\u002Fp\u003e\n\n    \u003ch3\u003e9. Haftung\u003c\u002Fh3\u003e\n    \u003cp\u003e9.1. Selbstbetrachtung \u002F Gabriele Küppers haftet nicht für Schäden, die dem Klienten im Zusammenhang mit der Beratung entstehen, es sei denn, diese beruhen auf vorsätzlichem oder grob fahrlässigem Verhalten.\u003c\u002Fp\u003e\n    \u003cp\u003e9.2. Die Beratung ist eine unterstützende Maßnahme; die Verantwortung für Entscheidungen und Handlungen des Klienten während und nach der Beratung liegt ausschließlich beim Klienten.\u003c\u002Fp\u003e\n\n    \u003ch3\u003e10. Änderung der AGB\u003c\u002Fh3\u003e\n    \u003cp\u003e10.1. Selbstbetrachtung \u002F Gabriele Küppers behält sich das Recht vor, diese AGB jederzeit zu ändern. Die aktuellen AGB sind jederzeit auf der Webseite einsehbar.\u003c\u002Fp\u003e\n    \u003cp\u003e10.2. Für bereits gebuchte Beratungsleistungen gelten die zum Zeitpunkt der Buchung gültigen AGB.\u003c\u002Fp\u003e\n\n    \u003ch3\u003e11. Schlussbestimmungen\u003c\u002Fh3\u003e\n    \u003cp\u003e11.1. Sollten einzelne Bestimmungen dieser AGB unwirksam oder undurchführbar sein, bleiben die übrigen Bestimmungen davon unberü
